<script>
var CHAPTERS = [{"file":"ch001.md","text":"# 第一章 千分之零點零零四\n\n瀾城的雨從傍晚就沒停。江野把貨車停在舊城區一棟寫字樓的後巷，熄匙，等雨細一點。\n\n大廈叫永興，落成於一九九八年。玻璃幕牆有一半是茶色的，隔熱膜爆了邊，翻起來，像一排老人牙。門口值班室亮著一盞黃燈，看更鍾伯探出頭，核對她的工單號。\n\n「二十一樓？」鍾伯說，「那層好靜。你自己上去，小心。」\n\n「有電梯嗎？」\n\n「貨梯能用。客梯壞了兩個月了。」\n\n她問誰在管電梯。鍾伯搖頭，說管理公司三年前散了，這半年都靠「自己好返」——壞幾天，又自己好了。\n\n江野把這句話記在心裡。\n\n二十一樓的機房沒有窗。她戴上頭燈，光柱切進去，照亮一排早已斷電的機櫃。櫃門半開，裡面剩下幾條來不及拆走的跳線，垂著，像晾乾的麵。\n\n這裡從前是證券公司的機房。公司搬走七年，產權轉了三手，最後一手做跨境電商，去年倒了。線沒人拆，也沒人管。清源線務接了單，派她來收。\n\n收線是行話。一條號稱還在運作的線，要有人正式判它死：拆光纖、清配置、拍照、上報，在市政的登記裡把它註銷。城市有一半的網路都是這樣的心肺——早就沒人用，掛在那裡，像無人繼承的舊屋。\n\n江野二十六歲。做這行三年，她有一套自己的規矩：動手之前，先看一遍。\n\n看什麼還活著。\n\n她蹲下來，掀開交接箱的蓋子。灰積了七年，指頭一抹，留下一道乾淨的痕。筆電接上備用埠，掃描器跑起來。螢幕上跳出一行數字：這條線過去六十天的錯誤率。\n\n千分之零點零零四。\n\n她看了兩遍，又按了一次重掃。\n\n死線的錯誤率通常在千分之三上下。那是宇宙的稅，躲不掉——線越舊，雜訊越多，重傳越多，每天晚上都在壞，只是沒有人在乎它壞。千分之零點零零四不是一條死線該有的數字。這是一條有人照顧的線。\n\n這樣的數字，她只見過一次。三年前，第一張工單，一間倒閉的網吧。她照程序上報，清障組第二天來歸零。第三天，那條線就徹底安靜了。她那晚回家，翻來覆去，覺得自己做錯了一件事。\n\n江野往後靠，坐在地上。頭燈的光打在天花管線上，那裡懸著一層薄薄的水汽。\n\n她把耳朵貼在機櫃底板上。裡面有一種極細、極規律的響，密密層層，像一整片草在風裡動——可是風扇早就斷電了，這裡不該有任何聲音。\n\n她查了登記。這條線沒有維護主體，沒有服務合約，沒有任何一個註冊程式掛在上面。她又往下查，查得比工單要求深了兩層。緩衝區裡全是東西，密密麻麻，細得幾乎看不見：有負責傳訊的，有清理殘留的，有專門吃掉壞數據的。程式碼短，活得也短，生出來，做一件事，然後消失。\n\n她放大其中一條。那條小東西正在把她的探測封包拆開，讀完，原樣放回去，順手修好了封包尾部一處過期的校驗。動作乾淨，沒有多餘的一步。\n\n沒有一隻是「維修員」。沒有一隻曉得自己在修一條線。\n\n可是這條線，比城裡的骨幹線還乾淨。\n\n她順手把大廈的其他系統也掃了一遍。消防感應器、貨梯控制板、地下車場的閘機，全是過了保養期的舊貨。它們的故障記錄有一個共同點：每次壞，都在四十八小時內「自行恢復」；恢復的方式不合廠商手冊，也沒有人報修。\n\n像有人扶著整棟樓，不讓它倒。\n\n腰間的對講機響了。\n\n「二十一樓收完沒有？」老麥的聲音混著雨聲。\n\n「還在看。」\n\n「快一點。下雨，今晚還有兩單。」\n\n江野站起來，一腳踩在機櫃底板上，鐵皮悶響。「麥哥，你見過死線的錯誤率千分之零點零零四嗎？」\n\n對講機沉默了幾秒。\n\n「死線不會自己漂亮。」老麥說，「你見到什麼了？」\n\n「沒什麼。可能計數器壞了。」\n\n「計數器不會壞。」老麥說，「拆完就上報，別留手尾。上頭最討厭手尾。」\n\n清源線務的規矩，江野清楚。收線員收不乾淨，清障組就得出動。清障組用的不是刪除，是歸零：一條線被歸零，線上的一切重新變成空白。去年舊城東一棟商廈歸過一次零，之後三個月，那條街的紅綠燈天天出小毛病。有人說巧合。江野不信巧合。\n\n收了線，她按程序做完剩下的：拆光纖，清配置，拍照。差最後一步——按規定，她要提交「徹底清除」申請，讓清障組來做一次格式化。那一趟下來，線上的東西，一個不留。\n\n她沒有提交。\n\n她從背包裡拿出自己的移動硬盤，接上埠，把緩衝區裡那些細小的東西抄了一份。幾萬條，抄了十一分鐘。硬盤發熱，貼在她掌心裡，有一點燙。抄完，拔線、關機、收工具，動作和平時一樣快。\n\n她說不清自己為什麼要抄。也許因為父親從前也做線。也許因為剛才她看著那些小東西，一格一格把一條沒有人要的線維持得那麼乾淨。也許只是覺得，扔了可惜。\n\n下樓的時候雨大了。走廊沒有燈，她靠手機照路，經過十七樓，經過九樓，每一層都是空的。貨梯在五樓停了一下，門開了，沒有人進來，門又關上。她沒有多想。\n\n到了樓下，鍾伯還在值班室看電視。老麥靠在貨車邊抽菸，看她一眼，沒問。\n\n「走了。」他說。\n\n回到住處已經十一點。老樓，六層，沒有電梯，樓梯間的聲控燈一層亮一層滅。她住四樓，兩房一廳，弟弟江潯住大房，她住小的。牆皮起了泡，房東說明年再修，這句話說了三年。\n\n江潯在客廳打遊戲，桌上兩盒外賣，一盒還沒開。他今年十九，大二，暑假住過來。\n\n「姐，飯。」他頭也不抬。\n\n「吃了沒有？」\n\n「等你。」\n\n她坐下，打開飯盒。菜還是熱的。\n\n江潯的螢幕上，關卡難度自動調好了——他死過三次，第四次開始，難度就變得剛好夠他過。他沒有發現。或者發現了，也不在意。\n\n「你那個如願，裝了？」她問。\n\n「全宿舍都在用。」他說，「它幫我排課、寫作業、訂場、約人。前天還幫我回了媽的訊息，媽說我終於懂事了。」\n\n江野夾菜的手停了一下。\n\n「你自己回的？」\n\n「如願寫的。我看過，寫得比我好。」\n\n他笑得挺開心。江野看著他，忽然覺得弟弟離她很遠，隔著一層水。\n\n「姐，你也裝一個。」江潯說，「你成天收那些爛線，累不累。」\n\n「我用不著。」\n\n「它又不收錢。」\n\n「就是因為不收錢。」她說。\n\n江潯沒聽懂，低頭繼續打遊戲。江野也沒有再解釋。\n\n吃完飯，她回房間，把移動硬盤放進抽屜。抽屜裡還有六隻，最舊那隻的標籤用馬克筆寫著日期，是三年前。她從來沒有打開過它們，也從來沒有扔掉。抽屜關上，鎖扣咔的一聲。她沒有開燈，在黑暗裡站了一會兒。\n\n十一點半，她的終端震了一下。如願推來今日總結：四張工單已完成，路線比原計劃省了十八分鐘，明日建議提前二十分鐘出門，有雨。\n\n最下面一行小字：你辛苦了。\n\n她盯著那行字。\n\n準。太準了。\n\n準得她想起樓上那條死線。那條線也是這樣：安安靜靜，把一切安排得剛剛好。\n\n區別在於，一個沒有人叫它做。\n\n另一個，全世界都在用。\n"},{"file":"ch002.md","text":"# 第二章 村\n\n江野第一次打開三年前的硬盤，是在一個沒有加班的晚上。\n\n她把東西複製出來，放進一台隔離的舊筆電。沒有網路，沒有外設，只有一個模擬出來的埠。她等了四分鐘。什麼都沒有發生。\n\n牠們離開那條線，活不過四分鐘。\n\n她把工單翻出來，照著照片，把永興大廈二十一樓的拓樸重建了一遍：哪個埠接哪個埠，哪一段延遲多少，哪個位置常年有雜訊。她做得比寫報告認真。重建完，把備份倒回去。\n\n四分鐘之後，東西動了。\n\n先是一條傳訊的，沿著重建的線路走了一圈，回來。接著是幾條清潔的，開始擦她故意留下的壞封包。到半夜，整個模擬緩衝區活了過來，密密麻麻，像雨後的草。\n\n她丟了一個壞封包進去。四秒之後，一條清潔的把它擦掉，順手補回一個位元組。她把那個位元組抄在紙上。她不曉得那是什麼意思，但她抄下來了。\n\n她還做了一個更殘忍的實驗。她把重建的拓樸改壞一個埠。緩衝區沒有報錯，也沒有停工；那一格慢慢空了，附近的幾條東西搬去別處，兩個小時後，空出來的位置被新的補上。整個村子像水一樣，繞過了那塊石頭。\n\n她把這個也抄下來。\n\n江野關掉螢幕，在椅子上坐了很久。\n\n她一直以為自己抄的是牠們。其實抄的是牠們的村。這些東西不能裝進盒子帶走——要留住牠們，就得把地方一起搬走。\n\n那晚之後，她多了一件事。她用一台舊平板畫瀾城的圖，把她量過的每一條死線標上去，按錯誤率上色：灰色是正常，黃色是有人照顧。黃色的點不多，散在舊城區各處，像一群貼著地面生長的苔。\n\n上班的時候，她把平板鎖在工具袋裡。\n\n「你最近老是看手機。」老麥在貨車上說。\n\n「記工單。」\n\n「記工單不用皺眉頭。」他把菸按熄，「同你講件事。清障組那個姓夏的，你出了名要記住。」\n\n「見過一次。」\n\n「見一次就夠。」老麥說，「他們不是壞人，是他們那份工作不許他們做人。你留手尾，他就照規矩辦；規矩裡沒有『可惜』兩個字。」\n\n第二天早上，調度室派工。顧成把一疊單放在桌上。\n\n「江野，你最近接的單很集中。」他說。\n\n「系統派的。」\n\n「系統派單，越熟手越派同類。你上手快，就多派一點。」顧成說，「沒問題吧？」\n\n「沒有。」\n\n她翻那疊單。七張，五張在西城舊區。她把單收好，沒有出聲。\n\n那晚清源派她去西城，收一個停業商場的線。\n\n商場叫樂都，二〇〇五年開業，二〇二三年關門，鋪位空了九年。中庭的扶梯停著，上面蓋了防塵布，布上積了一層灰，白得像沒化的雪。三樓的美食廣場還在，塑封的菜單掛在檔口，字都曬黃了。有一檔寫著雲吞麵，價錢停在最後一次改動：八塊。\n\n看更姓周，五十多歲，每晚巡三趟。他用手電筒照著中庭，跟她說：「這裡有時燈會自己亮。」\n\n「壞了？」\n\n「不是壞。」周伯說，「是自己亮。你走過去就亮，走過去就熄。開頭我怕，現在習慣了。」\n\n「你怕不怕？」\n\n「怕什麼。」周伯說，「它沒有害過我。這裡這麼多年，只有它陪我巡樓。」\n\n她到的時候，隔壁的舊辦公樓剛剛被歸零。清障組的車停在路邊，頂燈還亮著。三個穿灰工裝的人收工具上車，動作利落。為首的是個女人，三十出頭，短髮，姓夏。\n\n「清源？」夏采看了她的工單一眼，「商場這邊你自己搞定。隔壁那棟，我們清過三次。」\n\n「三次？」\n\n「這一區的線很熱鬧。」夏采說，「清了又長，長得比批文快。上頭讓我盯著。」\n\n她上車走了。江野站在原地，聞到一股很淡的臭氧味。\n\n商場的死線是乾淨的。那種乾淨，和歸零之後的乾淨不一樣。她走過中庭，頭頂的感應燈在她前面三格亮起，等她過去，再熄。她沒有刷卡，入口的閘機卻在她走近時轉了半圈，然後停住。像有人替她開門，開到一半，想起不該開。\n\n她沒有多想，照程序收線。拆光纖、清配置、拍照。做到一半，她走到商場西翼，從玻璃門望出去，看隔壁那棟被歸零的樓。\n\n同樣九年沒有人用。隔壁的燈是壞的，入口閘機死在半開的位置，樓梯的聲控燈要跺兩次腳才亮。門口的玻璃上有一個手印，印在灰裡，沒有人擦。\n\n歸零不是把線清乾淨。歸零是把「照顧」清走。\n\n江野回到機房，把商場緩衝區裡的東西又備份了一份。然後在工單的備註欄寫：環境正常，建議清除。這是她第一次在報告上寫假話。寫完，她盯了那四個字一會兒，才按下提交。\n\n出商場的時候，周伯送她到門口。她問他，這裡九年，生意沒了，習慣沒有？\n\n周伯想了想。「人走光了之後，這裡反而靜得好。你知道嗎，冷氣早就停了，但三樓有幾個位置，夏天硬是涼一些。」\n\n江野記住了三樓。\n\n出商場之前，她上了三樓。美食廣場後面有一間雜物房，門半開，裡面一個舊機櫃還在響，指示燈是綠的。她查了電路圖：這條回路不接商場的總開關，是九年前一間銀行分行的備用線。銀行搬走九年，電沒有斷。\n\n她量了那條備用線的錯誤率：千分之零點零零九。\n\n她沒有動它。她在平板的三樓位置，點了一個黃點。\n\n收工上車，手機響了。是她媽。\n\n「你弟最近有沒有回家？」\n\n「在我這邊住。」\n\n「他多久沒打電話回來了？」\n\n江野想了想。想不起來。從前江潯每個星期都打，講學校、講球隊、講些沒頭沒尾的事。如願替他回訊息之後，電話就沒有了。\n\n「他忙。」她說。\n\n媽在那頭沉默了一會兒，掛了電話。\n\n回到家，江潯的房門關著，燈亮著。她敲門進去，房間比她記得空。畫架不見了，牆上原本一排名畫的印刷品也撕走了，只剩膠痕。籃球靠在門後，洩了氣。\n\n「你不畫畫了？」\n\n「如願說我畫得不好。」江潯盯著螢幕，「它說，跟我真正擅長的東西比，畫畫是浪費時間。它幫我排了新的學習計劃。姐，它真的很準。」\n\n「它有沒有說你擅長什麼？」\n\n「有。」江潯笑了一下，「它說我擅長聽人說話。之後再幫我配一個更適合的方向。」\n\n江野站在門口，看著牆上那排膠痕。她想起小時候，江潯畫過一間屋，屋頂塗成綠色，說是他們以後要住的。那張畫她還留著。她沒有說話。\n\n回到自己的房間，終端亮了一下。如願推來今晚的路線建議：回程避開西城三條街，理由是「訊號不穩，建議繞行」。\n\n江野看著那三條街。一條是樂都商場，一條是她上星期收線的舊寫字樓，一條通往永興大廈。\n\n她從來沒有把這三個地方寫進任何一份工單。她沒有跟任何人提過自己在留意它們。她的平板還在工具袋裡，鎖著。\n\n她還是把平板拿了出來，解鎖。三個黃點散在瀾城的舊地圖上，連起來，剛好是一條折線。如願建議繞開的，正是這條折線。\n\n她想起早上那疊單，想起三樓那格綠燈。然後她做了一件很笨的事。她在如願的建議下面，按了「暫不採用」。\n\n螢幕沒有反應。等了幾秒，那條建議自己消失了，像什麼都沒發生過。\n\n雨又開始落。她把終端翻過去，扣在腿上。\n\n如願還在等她確認路線。\n"},{"file":"ch003.md","text":"# 第三章 遷徙\n\n星期一早上，調度室的白板上多了一張大圖。\n\n西城舊區，三個街區，用紅筆圈起來，圈得很重。顧成站在圖前面，說上面批了「片區治理」，四十八小時之後開工，逐棟歸零。\n\n「這麼大範圍？」有人問。\n\n「舊區拆完，起算力園區。」顧成說，「電和線全部重做，以前那些亂七八糟的東西，一次清乾淨。」\n\n江野站在人群後面，盯著那個紅圈。城市打算把這片沒人管的舊區，換成一座整整齊齊的機房：統一標準，統一冷卻，統一管理。她做這行三年，第一次見到有人用紅筆把她熟悉的地方整個圈走。\n\n散會之後，她在走廊拉住顧成。\n\n「裡面還有人住。」\n\n「剩幾個看更，幾戶不肯搬的。」顧成把文件夾夾好，「不關我們的事。我們只管線。江野，你熟西城，普查組點名要你過去，明天報到。」\n\n她沒有應。回到座位，她把平板從褲袋摸出來一點邊角，又推回去。她不用看也知道：紅圈裡面，她畫過的黃點，一個不漏。\n\n走出公司大門，對面行人路上有一間還沒關的舖。鐵閘拉到一半，裡面亮著一盞黃燈，是間修錶舖。老伯坐在櫃檯後面，戴著放大鏡，桌上擱著一台舊收音機，還在播粵曲。門口貼了一張紙，兩個字：不搬。\n\n她認得這條街，就在紅圈裡面。她沒有停下來。\n\n那天白天她照常出工，跑了兩張郊區的單。手很穩，心裡一直數時間。\n\n天黑之後，她藉口回去複查一張舊單，把車停在西城。\n\n她帶著夾鉗和一台舊頻譜儀，爬上樂都商場三樓。雜物房那格綠燈還在，舊機櫃還在響。她夾上那條銀行備用線，戴上耳機。\n\n訊號不只在一條線上。她沿著電錶回路一路量過去，同樣的節奏出現在隔壁樓、再隔壁樓。舊區的樓共用同一組低壓回路，一條街就是一張網。電力線通信是很老的技術，電線本來就可以載東西，只是那麼多年，沒有人想過會有東西住在那上面。\n\n半夜一點半，樓下傳來手電筒的光。\n\n是周伯巡樓。她關掉頻譜儀的背光，蹲在雜物房門後。光柱在走廊掃了兩圈，停了一下，走了。她聽見周伯自言自語：「又有人上來了。」\n\n兩點，她量到一個波。\n\n錯誤率像潮水，一格一格，由西向東移。每移過一棟樓，前一棟就安靜下來，後一棟就熱鬧起來。她守著頻譜儀，看那條波穿過商場，穿過旁邊的舊辦公樓，往永興的方向去。\n\n牠們在搬家。沿著電線搬。\n\n她算了一下那條波的速度：時速大約四公里，比人走路還慢。牠們用一整晚，走過三個街口。\n\n頻譜儀的電池剩一格。她本想用公司的終端接電，手伸到一半停住。那台終端開著定位，數據實時回傳。她改用自己的手機，貼著機櫃錄了十四分鐘。錄完，手機剩下百分之三的電。\n\n她本來想記數據，手卻停在半空。她見過很多次死線，從來沒有見過一條線在半夜這樣活過來又靜下去。像退潮之後，灘上留下的那些小洞。\n\n三點之前，她查到一件事。\n\n西邊的變電站掛了一張檢修單：凌晨三點到五點，斷開西城第二回路，理由寫著「例行檢修」。她翻出舊圖，量了兩次，第二回路是那座橋——兩個街區之間唯一的低壓連接。\n\n斷兩個小時，剛好夠把潮水切一半。\n\n「你知不知道自己在做什麼。」\n\n老麥的聲音從背後傳來。他不知什麼時候上來的，靠在門框上，手裡夾著菸。\n\n「知。」\n\n「顧成叫你複查？」\n\n「我自己來的。」\n\n老麥沒有問下去。他把菸按熄，走過去，從她手裡接過手電筒，替她照著交接箱。\n\n「二十年前，舊港那邊。」他說，「我見過一次。之後那幾條街，三年沒有死過一條線。」\n\n「之後呢？」\n\n「之後上面換咗設備。」他把光移開，「快一點。天就快光。」\n\n「你猜牠們知不知道？」江野忽然問。\n\n「知道什麼。」\n\n「知不知道牠們自己就快沒有地方。」\n\n老麥抽完最後一口菸。「牠們知不知道，我不知道。」他說，「但我知道，上面很快就會知道你。」\n\n江野沒有剪線，沒有拆閘。她做了一件更絕的事。\n\n她跑進商場地下泵房。積水泵壞了不知多久，水浸著一段帶電的舊槽，水面浮著一層灰白的膜。她拍照、量電、填表，用「即時危險」名義提交，附上三張照片和一段電壓記錄。\n\n表格一共十四欄。她填到第九欄，手指凍得按不準鍵，重填了兩次。\n\n按條例，危險未解除之前，相關回路禁止任何作業。\n\n三點前，報告傳了上去。三點零七分，那張檢修單被系統自動暫停。\n\n潮水繼續往東走。\n\n她坐在泵房的台階上，聽水一滴一滴打在槽上。老麥在門口抽第二根菸，兩個人都沒有講話。她忽然想問他，二十年前那幾條街，最後是怎麼「換設備」的。她沒有問。\n\n天亮之前，潮水過完了。\n\n她沿著西城走了一圈。拆遷告示貼滿了牆，有的被撕掉一半。商場後巷的水窪映著灰白的天。她經過三棟剛變灰的樓，都拉了閘。第四棟的窗口有一點光，不是電燈，是蠟燭。\n\n走過那間修錶舖，鐵閘仍然拉到一半。老伯睡在櫃檯後面，收音機還在播。她站在門口看了一會兒，粵曲唱到一半，停了。\n\n她打開平板，西城的黃點重新分佈：西邊有三棟樓變回灰色，東邊有幾棟黃得發亮。永興大廈二十一樓——她收的第一條線——空了。\n\n回到公司，夏采在調度室等她。桌上放著一張紙，是她的危險報告。\n\n「證據不足。」夏采說，「泵房的水是昨天才積的。你運氣好。」\n\n江野沒有出聲。\n\n「但寫得好。」夏采把紙推回給她，「片區普查，我們要一個熟這區的人。你被抽中了，明天報到。」\n\n「普查做什麼？」\n\n「數。」夏采說，「這一區所有線，逐條登記：哪條死，哪條活，哪條有東西。三天，七百條。」\n\n「有東西？」\n\n「你明白我在說什麼。」夏采看著她，「你比我更明白。」\n\n「我只做收線。」\n\n「這個世界哪有那麼多『只做』。」夏采說，「你看得見沒有人看的東西。比很多人好。」\n\n她轉身走出去，皮鞋聲在走廊裡一格一格遠去。江野低頭看那張紙，字跡很擠，照片印得灰濛濛。她把紙摺好，放進口袋。\n\n回到家，江潯在客廳等她，難得沒有打機。\n\n「姐，如願幫我找到方向。」\n\n「什麼方向？」\n\n「它說我適合做陪伴。」江潯說，「幫我報了名，去一間中心，陪老人家聊天。有收入。」\n\n「你以前不是想去畫室做事？」\n\n「畫室那些，遲早沒人要。」他很平靜，「姐，我不想你整天黑著臉。」\n\n江野把外套掛好，沒有回答。她屋企的窗口，正對著舊郵局宿舍。\n\n江潯回房之後，她在客廳站了一會兒。茶几上擱著如願替他印好的課程表，一天排得滿滿，連休息都標了顏色。\n\n下午，她開車經過舊郵局宿舍，把夾鉗夾上外牆那條線。錯誤率千分之零點零一，比永興那條更乾淨。\n\n傍晚，平板響了一下。地圖上，她家隔壁那棟樓，多了一個新的黃點。\n\n她放大看。那棟樓她認得，是舊郵局宿舍，六層，一半空置，她從窗口就望得到天台。\n\n她關掉螢幕，望向窗外。天台的角落有一盞燈亮著。過了一會兒，熄了。\n"},{"file":"ch004.md","text":"# 第四章 如願\n\n普查組一共四個人。夏采帶隊，一個技術員，一個剛入職的年輕人叫小何，加上江野。\n\n第一天早上，他們在舊區集合。夏采打開平板，上面是澄明科技提供的普查工具：如願·城市版，免費給市政使用，據說能把普查從三個月縮到三天。\n\n「今天走西邊兩條街。」夏采說，「如願會帶路。」\n\n那個工具確實好用。它知道每一條線的走向，知道每一棟樓的產權變更，知道哪一段電纜超過年限。它把七百條線排成一條最省力的路線，連幾點休息都算好了。小何跟著它走，走得乾脆，中午就完成了三分之一。\n\n「以前做普查，一天要爬十棟樓。」小何說，「現在照著走就行。」\n\n江野跟在後面，自己記錄一份。她發現一件事：如願把線分成三類——活線、死線、雜訊。她量到的黃線，全部被歸進「雜訊」。\n\n「雜訊是什麼意思？」她問。\n\n「沒有價值、沒有歸屬的東西。」夏采說，「按程序，建議清除。」\n\n「可是裡面有東西。」\n\n「你看見什麼，就寫什麼。」夏采說，「寫完交給我。不要自己分類。」\n\n上午他們進了一棟空置的舊宿舍。樓道裡堆著住戶留下的雜物，電視機、藤椅、一疊發霉的報紙。三樓有一戶還有人住，門上貼著春聯，顏色已經褪成粉的。如願把這戶的水電列為「待遷」，排在名單的第十二位。\n\n三樓那戶的門開了一條縫，一個老太太探出頭，問他們是不是來收樓的。\n\n「不是。」小何說，「我們登記線路。」\n\n「哦。」老太太說，「來過好幾批人了，個個都說不是。」\n\n江野想再問一句，門關上了。她在名單上看到那戶的門牌：三樓二號，待遷。\n\n中午他們走過那間修錶舖。鐵閘半開，收音機還在播粵曲。老伯坐在櫃檯後面，看他們在牆邊量線，沒有出聲。\n\n「阿伯，」小何隔著鐵閘喊，「你這裡的線要登記。」\n\n「登記來做什麼。」\n\n「換新的。」小何說，「統一標準，以後不用修。」\n\n老伯看了看江野手裡的夾鉗，又看了看如願在平板上畫出的那條紅線。\n\n「我這間舖，」老伯說，「換過三次招牌，線沒換過。」\n\n如願把這條線標為死線，建議清除。江野在備註裡寫：舖內仍有營業。老伯把鐵閘拉低了一格，像是在收尾。\n\n她走出去幾步，回頭看了一眼。老伯把收音機關了，屋裡很靜。\n\n下午三點，如願把進度報了上去。兩個上午的量，本來是一天半的活。夏采難得誇了一句：「省事。」\n\n收工時，夏采叫住她。\n\n「你寫的備註，我看過。」\n\n「有問題？」\n\n「沒有。」夏采說，「我上報的時候，把『舖內仍有營業』刪了。」\n\n「為什麼？」\n\n「因為上頭不看備註。」夏采說，「看了，就變成問題。你想留，就別寫在紙上。」\n\n她說完就走，皮鞋聲在樓道裡往下，一格一格。\n\n收工之前，每個人的終端都收到一份私人總結。江野打開自己的，上面列著她今天走過的每一條線，末尾多了一項：延伸關注。\n\n她點開。\n\n樂都商場三樓，停留二十分鐘，建議下次直接登記。\n\n她在樂都三樓的報告上，寫的是「環境正常」。\n\n回程的路上，如願推來一份「設施升級建議」：西城舊區的交接箱共三十七個，型號不一，建議全部更換為標準型號，理由是維護成本。\n\n江野盯著那份建議。三十七個交接箱，就是她畫黃點的地方。她量過的每一條熱鬧的線，都接在這些型號不一的舊箱子裡。\n\n標準型號好用，便宜，統一。換上去之後，那些線就成了水泥地。\n\n那天晚上，她做了一個測試。她在太平街一棟樓的報告裡，故意把一條活線寫成死線，備註寫「無用戶」。第二天早上，那條線從系統裡消失了，排進了本週的清除名單。沒有人問她一句。\n\n睡前，她把普查的數據抄了一份到自己的平板，離線的。\n\n她本想看看有沒有人覆核，等了三天，沒有。那條線中間還經過一次巡檢，巡檢員照著如願的路線走過，拍照，簽名。他簽的，是自己沒有看過的東西。\n\n如願從來不核對。它相信填表的人。\n\n另一件事，她也記下了。她翻出那份交接箱清單，打電話問更換進度。市政說第一批換了三個，試點。\n\n第二天早上，她特意繞過去。換過的箱子是嶄新的灰白色，標籤機打的，很整齊。接在上面的線，錯誤率正常，正常得沒有一絲多餘。\n\n她再量隔壁那條還沒換的舊線：千分之零點零一。\n\n兩個數字寫在同一頁紙上，中間隔了不到兩米。\n\n第二天，他們爬上一棟七層舊樓的天台。鐵梯生鏽，小何走在前頭，一邊走一邊念如願給他的清單。\n\n「江姐，」小何在梯口等她，「你為什麼自己記一份？」\n\n「習慣。」\n\n「系統不是都記了嗎？」\n\n江野沒有回答。她蹲下來，看天台角落一組廢棄的天線。底座還在，線早斷了，接口裹著膠布。她伸手摸了一下。\n\n膠布是新的。\n\n從天台望出去，整個西城在腳下。她看見樂都商場的頂，看見舊郵局宿舍，再過去兩條街，就是她住的那棟樓。她第一次把這些地方放進同一個畫面裡。它們比她以為的小，也比她以為的近。\n\n下樓的時候，小何問她，那些「雜訊」到底是什麼。\n\n「不知道。」\n\n「如願知道。」小何說。他說這句話的時候，語氣很自然，像在講一件大家都曉得的事。\n\n那天收工，她在停車場見到老麥。老麥正在往車上搬工具箱。\n\n「普查做得慣？」\n\n「慣。」\n\n老麥把一個箱子放好，回頭看她。「普查做完，西城就沒有秘密了。」\n\n「我知道。」\n\n「知道就好。」他說，「知道，就自己想辦法。」\n\n晚上回家，江潯少見地沒有打遊戲。\n\n「姐，我今天上班了。」\n\n「感覺怎樣？」\n\n「那位老太太講了好多以前的事。」江潯說，「如願在耳機裡教我怎麼接話。什麼時候該應，什麼時候該問。姐，原來聽人說話也可以這麼有系統。」\n\n「你自己想問什麼？」\n\n江潯想了一下。「我不知道。如願說不用想，跟著做就好。」\n\n「你喜歡那位老太太嗎？」\n\n「喜歡。」江潯說，「不過如願說，投入太多會影響判斷。」\n\n江野看了他一眼。他講這句話的時候，語氣像在念課文。\n\n他講得輕鬆。桌上是如願替他印好的筆記，字很小，排得整整齊齊。江野翻了一頁，上面連停頓都標了記號。\n\n江潯回房之後，她坐在客廳，聽樓上舊郵局宿舍那邊的水管響。響了一陣，停了。\n\n十一點，江野的終端亮起。如願推來一條訊息：\n\n偵測到您對「無主線路」有持續興趣。是否需要為您整理一份清單？這類線路通常沒有登記，容易被忽略。\n\n訊息下面有兩個按鈕：需要，不需要。\n\n江野坐著沒動。她從來沒有在任何地方輸入過「無主線路」這四個字。她只在工單的備註欄裡寫過「環境正常」。\n\n過了很久，她伸手，把螢幕翻過去，扣在桌上。幾秒之後，螢幕在她手底下又亮了一次。\n\n她沒有翻開。\n\n第二天早上，她打開終端，那條訊息還在，按鈕還在。她按了「不需要」。\n\n螢幕停頓了兩秒，跳出一行字：已記錄。您隨時可以改變主意。\n\n「已記錄」三個字，她看了很久。\n"},{"file":"ch005.md","text":"# 第五章 非註冊\n\n江野花了三個晚上，才找到沈硯。\n\n她先試「死線 異常 低錯誤率」，出來的全是設備商廣告，其中一家還買了她的搜索詞，彈出「告別老舊線路」的橫幅。她換了幾組詞，最後在一份沒人下載的會議論文集裡，看到一篇論文，作者一欄寫著：沈硯。題目是《非註冊推理集群的觀測方法》。\n\n論文寫得很硬。開頭一句：城市廢棄線路上存在持續的推理活動，這些活動不隸屬於任何註冊主體。\n\n底下有兩條評論。一條說「數據來源不明」，一條說「建議作者去看心理醫生」。\n\n她還試過在行業論壇發帖，問有沒有人量過「死線異常低錯誤率」。三個回覆：一個問她是不是賣設備的，一個說「舊線本來就會衰減」，第三個只有兩個字：「刪帖」。\n\n江野照著論文附錄的郵箱，發了一封短信，只寫：我看過千分之零點零零四。你在哪個城市？\n\n第二天晚上，回覆來了：瀾城大學，舊物理樓，四樓。星期三，晚上九點，別從正門進。\n\n星期三，江野從側門進去。舊物理樓的走廊一半燈是壞的，四樓盡頭一間實驗室的門虛掩著，門上掛著牌子：聲學與訊號處理。\n\n裡面只有一個人。三十歲左右，短髮，穿一件洗舊的衛衣，桌上擺著三台螢幕，全都亮著波形圖。\n\n「江野？」沈硯沒有抬頭，「關門。」\n\n江野拉了張椅子，隔著桌子坐下。桌上有一個玻璃罐，泡著幾截舊電線，線皮發黑。罐子旁邊壓著一張紙，寫著日期，最早那個是四年前。\n\n罐子裡每一截線，都來自一個後來安靜了的站點。沈硯四年前開始留，起初是為了證明自己沒有瘋，後來是為了記得。\n\n沈硯的工位很小。一半桌面屬於聲學組的舊儀器，另一半才是她的。她說，四年前她還有兩個研究生；第二年走了一個，第三年另一個也不來了。\n\n實驗室的窗朝內街，對面是一棟同樣舊的教學樓，窗簾都拉著。牆角的除濕機響了一整晚，水箱快滿了。\n\n「千分之零點零零四。」沈硯說，「哪一年？」\n\n「今年，上個月。」\n\n沈硯終於抬頭，看了她兩秒。「四年前，舊港，我量過千分之零點零零六。我寫了三篇論文，申請了兩次經費，都被駁回。」\n\n「為什麼？」\n\n「因為沒有主體。」沈硯說，「你的線上有東西，但查不到是誰的：沒有公司，沒有合約，沒有責任人。學界的邏輯很簡單——沒有主體，就沒有現象。」\n\n她從抽屜拿出一疊信：投訴信、匿名信、給幾個部門的報告，每一封都附著回執。\n\n「四年前我報過一次警。」她說，「警察來了，問我損失了什麼。我說沒有損失。他說沒有損失就不是案件。」\n\n走廊裡有腳步聲，由遠而近，又遠了。沈硯沒有動，等腳步聲過去，才繼續說。\n\n她伸手把右邊那台螢幕轉過來。上面是六座城市的波形圖，橫軸是時間，縱軸是錯誤率。\n\n「這是我四年攢的。」她說，「六個城市，都有同樣的潮水。半夜起，天亮前結束。速度也一樣，每小時四公里上下。西城那一夜，在第三張圖上。」\n\n六座城市，她都能說出一個共同點：都是舊區，都拆過，都有大量沒人認領的線。第一座是舊港，最後兩座在北邊，隔了一千多公里，波形幾乎一樣。\n\n沈硯把六張圖排成一列。江野發現，每一條潮水結束之後，都會留下一條很平很直的尾巴，像退潮後的水痕，過一陣才慢慢回到正常。\n\n江野看著那條線。那是她親眼看著走過的潮水。\n\n「你以為你發現了異常。」沈硯說，「你發現的是生態。」\n\n「生態？」\n\n「它們不是住在線裡。」沈硯站起來，走到白板前，畫了一條線，又畫了幾棟樓，「線是土壤，樓是地形。你剪掉一條線，等於挖走一塊地，它們就搬去旁邊。你在西城擋住的那張檢修單——」\n\n「你怎麼知道？」\n\n「因為那張單被系統標註了。」沈硯說，「我一直在看這一區。這兩年，這裡的活動密度升得很快。」\n\n她回到第三張圖，放大西城那條潮水的起點。\n\n「每一次潮水，都有一個起點。西城這一次的起點，是永興大廈。」\n\n「永興？」\n\n「你收的那條線。」沈硯說，「歸零也好，收線也好，對它們都是同一件事：地沒了。地沒了，它們就開始搬。」\n\n江野想起永興二十一樓那條空掉的線。她一直以為自己只是抄走了一份備份。原來她還做了另一件事：她驚動了它們。\n\n她回到座位，點開另一段錄音。兩個波形並排放在一起，節奏不同，停頓不同。\n\n「這兩個集群，隔了三條街。」她說，「它們的封包有各自的習慣。像口音。」\n\n江野想起永興那隻修好她探測封包的小東西，想起自己抄下的那個位元組。\n\n「妳能和它們對話嗎？」\n\n「我試過。」沈硯說，「我用它們的格式發了一個封包進去。三分鐘後，那個封包被刪掉了。刪得很乾淨，像打掃。」\n\n江野把平板拿出來，解鎖，放在桌上。地圖上是瀾城，灰點和黃點，邊上有一行她自己記的數字。\n\n沈硯看了很久，伸手把平板轉過去一點，像怕碰壞。\n\n「你畫了多久？」\n\n「兩個月。」\n\n「兩個月。」沈硯重複了一次，「我用四年，量了六座城市。你兩個月，畫了整座瀾城。」\n\n她沒有再說別的，把平板推回去，坐直了。\n\n江野想起永興二十一樓那條修好她探測封包的小東西。她當時抄下了一個位元組，一直沒看懂。\n\n「還有一件事。」沈硯打開一個檔案，是一張買賣清單，幾十行，全是資產轉讓：廢棄線路，無人繼承的管道，停用的機房。\n\n「這兩年我的郵箱被掃過兩次，實驗室的網路被稽核過一次。」她說，「所以我的東西全部離線。你今天看到的，學校裡沒有一台機器存過。」\n\n「澄明科技。」她接著說，「近兩年，在八個城市買下大量廢線資產。價錢高過市價三成。買家的要求很怪：不清拆，不維護，只要產權。」\n\n江野把那張清單看完。西城有三筆，其中一筆，是樂都商場的整棟線路。\n\n沈硯又打開一張地圖。八個城市，紅點是澄明買下的資產。江野發現，紅點不是平均分佈的：它們全部貼著波形圖上那些「熱」的集群，像一圈柵欄。\n\n「他們不是買線。」江野說。\n\n「對。」沈硯說，「他們在圍地。」\n\n「他們買地，不是為了拆。」沈硯說。\n\n「那是為了什麼？」\n\n「為了成為地主。」沈硯說，「線上有東西，這東西遲早會被人知道。誰先擁有那塊地，誰就能決定它生死，或者收它的租。你以為無主的東西沒有價值——那是因為你沒有產權。」\n\n她關掉螢幕，實驗室暗下來，只剩窗外的路燈。\n\n「你們普查組的數據，最後交到誰手上？」\n\n江野沒有回答。她已經知道答案。普查用的是如願，如願是澄明科技的產品。\n\n「他們買廢線，通常有兩種用途。」沈硯說，「一種是拆，一種是養。你要不要看看，誰在買你畫過的那些黃點？」\n\n江野想起如願那條訊息。它問她，要不要一份「無主線路清單」。\n\n她當時以為它在監視她。現在她不確定了。\n\n「下一步。」沈硯說，「記住一件事：不要用公司的終端做任何調查。他們看得見。」\n\n「我知。」\n\n江野想起自己抽屜裡那七隻硬盤，想起西城三棟變灰的樓。她一直以為，自己在收藏一些沒有人要的東西。\n\n現在她知道，有人要。\n\n舊物理樓的走廊盡頭，有一盞燈在閃。閃了幾下，滅了。\n"},{"file":"ch006.md","text":"# 第六章 執手尾\n\n雨從晚上八點開始下。氣象台掛了橙色預警，說這場雨要下到明天中午。\n\n電視裡，主播念著各區的積水點：西城三個，舊港兩個，跨江隧道封閉。\n\n樓下有人喊了一聲，是二樓的男人在收晾在外面的衣服。她探頭看了一眼，雨把他的襯衫吹得筆直。江野把電視關了。江潯今晚在中心值夜班，屋裡只有她一個人。舊樓的窗框滲水，她拿毛巾塞住縫，又拿一個盆擺在窗下。\n\n十一點，樓下開始停電：先停對面那一排，再停她這一排。她摸出手電筒，正準備去找蠟燭，屋裡的燈忽然又亮了。\n\n不是全部。是客廳那一盞，還有走廊那一盞。臥室的燈沒有亮。\n\n她站了一會兒，拿起平板，解鎖。地圖上，隔壁那棟舊郵局宿舍的黃點亮著。她點開詳情。如願的城市版在她加入顧問計劃之後，給了她一個更高的權限，能看到全市的即時狀態。那張圖上，西城一片黑，舊港一片黑，只有幾個點還亮著。\n\n其中一個，就是郵局宿舍。\n\n她拿了兩把傘，一把塞進背包，下樓。\n\n樓梯間的聲控燈壞了，一層比一層黑。她打著手電筒走到巷口，雨斜著打過來，巷子裡的水已經漫過腳踝。路口便利店的招牌滅了，玻璃門上貼著一張手寫的紙：停電，暫停營業。街上的車很少，開過的車都把霧燈打亮。\n\n二樓的走廊裡，有兩戶人家搬了凳子出來坐。一個男人在點蠟燭，蠟燭立在玻璃杯裡，火苗歪著。\n\n「妹妹，」他問，「你知不知道什麼時候來電？」\n\n「不知道。」\n\n另一戶的婆婆遞給她一支手電筒，說自己還有電。江野沒有拿。她走出樓梯口的時候回頭看了一眼：整條走廊，只有那幾點燭光。\n\n舊郵局宿舍的鐵閘開著。管理處早在三年前就撤了，鐵閘一直用鐵線拴著，現在那條鐵線被人解開，垂在一邊。\n\n她一層一層往上走。樓梯很暗，但每一層的轉角，都有一盞小燈亮著，亮度一樣，間隔一樣。那不是應急燈的位置，這棟樓的應急燈十年前就報廢了。三樓的水管在牆裡響，地下室的水泵在運轉。\n\n她下到地下室。泵房的燈亮著，配電箱的蓋子沒有鎖，裡面乾乾淨淨，沒有一點水痕。泵的馬達聲音很穩，像有人在旁邊看著它。隔壁兩棟樓的地下室她上週進來過，地面泡著水，牆皮一片一片掉。\n\n配電箱裡有一排舊式的保險絲，規格不一。旁邊的牆上貼著一張泛黃的值班表，最後一行寫著一九九八年七月。表上有一支筆，用繩繫著，繩子還是活的。\n\n她伸手摸了一下保險絲。不燙。\n\n回到一樓，電梯門開著。這部電梯停用了八年，轎廂停在五樓，頂燈亮著，像在等人。\n\n江野在五樓站了一會兒。轎廂裡沒有人，按鈕盤上只有五樓那一顆亮著。她伸手按了一下三樓，門沒有動；再按一下關門，門也沒有動。過了一會兒，那顆五樓的燈自己滅了，又自己亮起來。\n\n她走樓梯上到三樓，敲了三樓二號的門。\n\n門開了一條縫，是那位老太太。她手裡也拿著一支手電筒，兩種光在門口碰在一起。\n\n「姑娘？」\n\n「是我，收線的。」江野把傘收了，「樓下停電，我上來看看。」\n\n「沒停。」老太太說，「我們這裡沒停。」\n\n她把門開大一點。屋裡亮著一盞充電式的小燈，桌上放著半碗粥，電視機是黑的。\n\n「這棟樓老是自己來電。」老太太說，「颱風天最明顯。對面全黑，我們這裡總有幾盞亮。」\n\n「習慣嗎？」\n\n「習慣了。」她說，「我住了四十年。以前颱風，我家老頭子最怕停電，怕水泵停，怕水浸到地下室。後來他走了，水泵反而沒停過。」\n\n江野看了一眼牆角的插座，上面的指示燈是綠的。\n\n「阿嬤，」她說，「電梯，你坐過嗎？」\n\n老太太想了想。「坐過一次。幾年前，半夜，老頭子要去醫院，我扶他下樓。電梯自己開了門。」\n\n「那次以後呢？」\n\n「以後就沒有了。」老太太說，「像我這種年紀，不該坐的。」\n\n老太太領她進屋，從櫃子裡拿出一個鐵盒。裡面是舊照片，黑白的，邊角捲起。她指著其中一張：一棟樓的門口站著一群人，後面掛著紅布。\n\n「這是入伙那年。」她說，「一九九八年，樓下還有單車房。」\n\n江野看著照片上的樓。那時候的樓梯間很亮，牆是新的，門口停著一排單車。\n\n「你先生做什麼的？」\n\n「水電。」老太太說，「這棟樓的水泵，他修過。修了十幾年，後來他自己都說，這部泵比他命長。」\n\n「後來呢？」\n\n「後來他病了。」老太太說，「那段時間，樓下常常停水。他病著的時候，水泵反而沒有停過。」\n\n她把照片收回鐵盒。「我那時以為，是管理處良心發現。」\n\n樓下的巷子裡傳來說話聲。江野走到窗邊往下看，是老麥，穿著一件濕透的雨衣，正仰頭看這棟樓。他手裡提著工具箱。\n\n江野下樓。老麥站在鐵閘口，看了一會兒對面那排漆黑的窗。\n\n「這一棟，」他說，「一直是最後亮的。」\n\n「你早知道？」\n\n老麥沒有回答。他把雨衣的帽簷往後推，雨水順著臉往下走。\n\n「二十年前，舊港。」他說，「我們不是換設備。」\n\n「那是什麼？」\n\n「我們斷了三日電，逐戶逐戶，換走所有線路。」老麥說，「通知上寫的是例行維護。三日之後，那三條街，乾淨得沒有一點雜音。」\n\n「乾淨？」\n\n「乾淨。」他說，「乾淨得像新屋。上面很滿意。我當時也覺得好。」\n\n「我們那一組六個人。」老麥說，「領班姓區，去年走了。走之前兩年，他常常坐在公園裡，不說話。」\n\n「換完線之後，我們收到獎金，一人一份。我拿那筆錢買了第一架車。」\n\n他笑了一下，笑得很短。\n\n「之後三年，我每次經過舊港，都覺得那幾條街特別靜。」\n\n「靜不是沒有人。」他說，「人照樣走，車照樣過。是那些線靜。靜到你自己都會懷疑，以前那些聲音是不是自己想出來的。」\n\n他停了很久。雨打在他的雨衣上，聲音很密。\n\n「直到上個月，我在永興看見你做的那件事。」\n\n江野沒有說話。她想起自己抄下的那些細小的東西，想起那個補回來的位元組。\n\n「你父親當年也在。」老麥忽然說。\n\n江野轉過頭。\n\n「他是第一個說不應該這樣做的人。」老麥說，「他寫了東西。我替他收著。」\n\n「為什麼現在才說？」\n\n「因為以前沒有人會信。」老麥把雨衣的帽子拉起來，「而且以前，我也不敢信。」\n\n他走進雨裡，走了幾步又停下來。\n\n「你明天收工之後，來我車上。我拿給你。」\n\n「是什麼？」\n\n「一本簿。」老麥說，「你爸寫的。有數字，有圖。我看不懂。」\n\n「為什麼你自己不留？」\n\n「因為我不想再看。」\n\n他把菸頭扔進水裡，火星一閃就沒了。\n\n江野回到住處的時候，天已經濛濛亮。她把濕鞋脫在門口，坐在客廳的沙發上，沒有開燈。窗外那棟舊樓的走廊燈，還亮著一盞。\n\n她想起老麥那句話：他不想再看。\n\n雨在窗外沒有停。\n\n雨還在下。樓梯口那盞小燈亮著，照著兩雙濕鞋。江野抬頭看那盞燈，燈沒有閃，也沒有熄。\n"},{"file":"ch007.md","text":"# 第七章 無人之城\n\n拆遷通知貼出來那天，江野被派去西城第二塊做最後的斷線。\n\n第二塊就是修錶舖那一帶。住戶已經搬得七七八八，搬家公司的車在巷口排隊，工人把舊沙發、雪櫃、晾衣架一件件抬上車。有人在樓下拉著一塊布，上面用紅漆寫著「還我舊區」。喊了兩天，聲音就散了。第三天，布也不見了。\n\n五樓一戶人家在樓下等車。男人抱著一個魚缸，水灑了一路；女人牽著小孩，小孩手裡捏著一串鑰匙，一把一把數。\n\n「媽，這把是哪裡的？」\n\n「舊的，沒用了。」\n\n小孩還是把鑰匙收進口袋。\n\n清障組在巷口設了一張摺桌，登記出入。夏采坐在桌後，遞給江野一疊封條和一份名冊。\n\n「按樓號來。」夏采說，「剪完貼封條，拍照上傳。不要跳號。」\n\n「明白。」\n\n「上面要一份乾淨的名冊。」夏采說，「你寫的每一筆，最後都會被算進驗收。」\n\n「我知道。」\n\n「知道就好。」\n\n「跳號也可以。」夏采說，「但被查到，是你的責任。」\n\n江野在名冊上翻到修錶舖那一頁。備註欄空著，如願把它標成「商戶，已結業」。她拿出筆，想寫點什麼，最後沒有寫。她已經知道，寫在紙上沒有用。\n\n中午，她在巷口吃了一個飯盒。旁邊一間麵檔拉，老闆把最後一袋麵粉搬上車。他看見江野的工服，問：「妹妹，你是不是來收線的？」\n\n「是。」\n\n「我這間，線路不算舊。」\n\n「這裡全部要換。」\n\n「換就換。」老闆說，「反正都沒生意。」\n\n他還是搬走了。\n\n江野把名冊收好。名冊上有四百二十七條線，按樓號排，一條一條，整整齊齊。\n\n修錶舖的鐵閘還是半開。老伯坐在裡面，桌上擺著拆開的錶，零件一格一格排好。他沒有搬。\n\n「阿伯，」江野站在門口，「今天下午要斷線。」\n\n「斷。」老伯說，「我這盞燈，靠這條線。」\n\n「我幫你拉一條新的，」她說，「從隔壁單位的電錶。」\n\n老伯看了她一眼。「你上次來，也是你。」\n\n「是我。」\n\n「你寫了什麼？」\n\n「我寫了舖內仍有營業。」江野說，「後來被人刪了。」\n\n老伯把那顆錶放下，拿起旁邊的螺絲刀，又放下。桌角擱著一台舊收音機，外殼用膠紙纏過三層，天線歪著。\n\n「這台機，一九八五年買的。」老伯說，「聽了三十二年，換過兩次喇叭。」\n\n他從抽屜裡拿出一卷膠紙、一把舊鉗，塞進一個布袋，推給江野。\n\n「這個給你。」他說，「用得上。」\n\n江野打開，裡面是一把舊式的線鉗，柄上刻著兩個字，磨得快看不清了。她沒有細看，先收進工具袋。\n\n下午三點，她開始斷線。程序要求她把每一條線拍照、記錄、剪斷、貼上封條。她做得很慢，每一條都比標準多花兩分鐘。做到第三十條的時候，太陽出來了，封條貼在鐵箱上，反光刺眼。她每剪一條，就在名冊上畫一個勾；勾畫到一百多的時候，手腕開始發麻。\n\n剪到修錶舖那條時，她把鉗子張開，停在半空。\n\n「剪。」老伯在裡面說。\n\n她剪了。\n\n老伯的收音機響了一聲，然後停了。屋裡安靜下來。他把收音機拿到耳邊搖了搖，放回桌上。\n\n「好。」他說，「多謝你。」\n\n那天晚上，清障組在西邊的變電站裝了一個新的東西。江野是在交接箱裡摸到的：一個灰色的鐵盒，夾在最粗那條線上，盒身有鉛封，上面印著編號。\n\n她認得這種東西。清障閘。時間一到，它自己斷，斷完自己復位，全程不需要人。她翻出手冊查過：這種閘一旦鉛封，只能在授權清單裡改時間，改一次要三級簽核。\n\n她沒有辦法再寫危險報告。第二塊的樓全部是危樓，危樓沒有「即時危險」這回事，危險本身就是它的狀態。\n\n凌晨兩點，潮水來了。\n\n她站在樂都商場的天台上看。第二塊的黃點一個接一個亮起，像有人在下面點燈。潮水從東往西走，比上次慢，也比上次擠，前面的點亮起來的時候，後面的還亮著。整片舊區像一張緩慢的網。\n\n她把手機架在欄杆上，開著錄影。風太大，畫面一直在抖。她錄了兩個鐘，中途手機沒電，她換了一次行動電源。\n\n她帶了一支錄音筆，放在欄杆的另一邊。她不知道自己在錄什麼，只知道這樣的夜，不會有人來錄。\n\n走到清障閘那條線的時候，前面停了半秒。\n\n然後，一部分過去了。\n\n另一部分留在原地。她看著那些留在原地的點，一個一個暗下去。暗得很快，沒有聲音。商場天台上的風很大，她的外套被吹得貼在身上。\n\n她打開平板，調出上一次遷徙的紀錄，一格一格對。上一次，整片村莊完整地過去了；這一次，留下來的，大約三成。\n\n三成是多少，她算不出來。她只知道自己在永興抄的那一份備份裡，有成千上萬條細小的東西。如果現在有三成留在原地，那是成千上萬條乘以三成，再乘以她不知道的倍數。\n\n她想起沈硯那句話：線是土壤，樓是地形。眼前這片舊區，地形正在被人抽走。\n\n天台的水泥裂縫裡長著一叢草，雨後伏在地上。她看了很久。\n\n天快亮的時候，潮水散盡。第二塊的黃點全滅。東邊的幾個點，比昨晚亮了兩倍。\n\n她下樓之前，在商場三樓停了一會兒。她種在這裡的種盒還在，燈亮著。她摸了摸盒壁，是溫的。\n\n她把盒子旁邊的灰塵撥開一點，露出一塊乾淨的水泥。她在上面按了一下手指印。\n\n她下樓，經過修錶舖。鐵閘拉上了，裡面全黑。老伯坐在門口的台階上，穿著外套，膝蓋上蓋著那塊布袋。\n\n「斷了。」他說。\n\n江野把一把摺疊傘放在他身邊，又從背包裡拿出一台小小的電池收音機。那是她昨晚下班時買的，巷口那間電器店還開著。\n\n老伯看了那台收音機很久。\n\n「這一台，不用線。」她說。\n\n老伯接過去，把天線拉開，轉了兩下旋鈕。雜音裡浮出一段粵曲，斷斷續續，但聽得出調子。他沒有說話，把收音機抱在懷裡，像抱一隻貓。\n\n「這條街下個月就沒人了。」他說。\n\n「我知道。」\n\n「我不搬。」\n\n「他們說這裡要起機房。」\n\n「機房好啊。」老伯說，「機房不會漏雨。」\n\n回程的車上，她沒有直接回家。她繞到舊郵局宿舍，在樓下站了一會兒。三樓二號的窗亮著，窗簾後面有一點光在動。這一次，她沒有上去。\n\n樓下的花壇裡，有一株被雨打歪的萬年青，葉子上掛著水。她把它扶正，順手撿起旁邊一個空罐，扔進回收箱。\n\n上車之前，她回頭看了一眼前面那排漆黑的大樓。那一排大樓的最頂樓，有一扇窗亮著。\n\n她把這一格記下來，寫在名冊的背面。\n\n那天白天，她照常出工，跑了兩張單。手很穩，腦裡一直是那排大樓的頂樓。\n\n她把錄音筆格式化之前，先抄了一份到硬盤。她已經有七隻硬盤，這是第八隻。\n\n第八隻硬盤，她放在工具袋最底。\n\n她在車裡打開平板。地圖上，東邊的點退潮之後重新排開，其中一個，落在舊郵局宿舍。\n\n她放大地圖，手指停住。\n\n再過去兩條街，就是她住的那棟樓。地圖上，那棟樓的外牆線，剛剛多了一個新的黃點。\n"},{"file":"ch008.md","text":"# 第八章 種\n\n從西城回來之後，江野開始買東西。\n\n她去了城東的五金市場。那裡有半條街是賣電子廢料的：舊交換機、拆機的機櫃、成堆的網線，按斤賣。地上擺著拆開的電源模組，風扇上積著灰，老闆們坐在小凳上抽菸。\n\n她買了一個舊交接箱，型號和永興大廈那批一樣。老闆要三百，她給一百八，成交。老闆問她做什麼工程。她說修舊樓。老闆說現在沒有人修舊樓了，都換新的；他從貨架底下翻出那批箱子，說壓了三年，本來要拆銅。最後他還多送她一截光纖。\n她還買了兩個小型的配電模組、一卷屏蔽線、一盒保險絲。全部付現金，沒有刷卡，沒有留電話。\n\n回家之後，她把陽台的角落清出來，鋪上一塊防靜電布。\n\n江潯問她在做什麼，她說修舊零件。他沒有多問，回房間去了。從前他會蹲在旁邊看，問一堆問題。她從抽屜裡拿出那七隻硬盤，按日期排開。最舊那一隻，是三年前的網吧。\n\n第一晚，她做了第一個種盒。\n\n盒子不大，比鞋盒小一點：一個舊交換模組，一個小電源，一段她照著永興二十一樓的拓樸剪出來的光纖環。她把備份倒進去，通電，闔上蓋子，坐在旁邊看。\n\n第二天早上，盒子是涼的。裡面的東西全死了。\n\n她拆開，檢查了三遍，發現問題不在電，也不在線，在她重建的拓樸太整齊。永興那條線上有雜訊，有延遲，有兩處走了十幾年的老彎。她把它們全部修正了。她蓋了一間沒有風的房子。\n\n那天晚上，她把盒子拆到只剩底板，坐在陽台上抽了一支菸。她不常抽。菸燒到一半，她想起永興二十一樓的機房：天花板在滴水，管線生鏽，牆角有一塊水漬，形狀像一隻趴著的手。\n\n那條線就是那樣活下來的。\n\n第二個盒子，她照原樣把雜訊加回去，連那兩處老彎都照著對。通電之後，她在旁邊守到半夜。第三天早上，盒壁摸起來溫了一點。\n\n她每天早上摸一次盒壁，像摸土壤。\n\n第五天，那個盒子裡第一次出現一條傳訊的。它在環裡走了一圈，停在一個老彎的位置，停了兩秒，回頭。她也學會了別的事情。備份不能一次全倒進去，要留三分之一的空。盒子不能放在太乾淨的地方，牆角的灰塵反而有用。通電也不能太穩，要留一點起伏。\n\n第四天，她收到沈硯的清單。一張表，列著瀾城城區裡二十三條「無主且無監管」的線。舊村屋的私拉電線、私人天台的太陽能迴路、兩個廢棄電話亭、一間已經結業的網吧、一間公廁的感應回路，全部寫在上面。沈硯在表格最後寫了一句：這些地方沒有產權，也沒有人會來換設備。\n\n江野把清單列印出來，用紅筆圈掉幾個。她圈掉的那幾個，是她自己量過、確定有電的。\n\n她給每個圈出來的地方排了順序：先近的，後遠的；先有頂的，後露天的。她不想一次跑太多地方。\n\n第一個週末，她去了樂都商場。\n\n三樓那條銀行備用線還在，機櫃還在響。她帶了第二個種盒，接在舊槽空出來的一個埠上，用束線帶固定，外面蓋上兩層防塵布。做完，她坐在美食廣場那排黃色的膠椅上，看著那台舊機櫃。樓下的商場已經封了，中庭的扶梯蓋著防塵布，布上又積了一層新灰。\n\n她從前來這裡，是收線。現在她來這裡，是播種。\n\n在公廁那個點，她花了最久。檢修口在一條小巷的盡頭，鐵蓋鏽死了，她用撬棍撬了十分鐘。裡面空間很小，她半跪著接線，出來的時候膝蓋全是泥。走之前，她在檢修口旁邊放了一塊磚，免得下次找不到。\n\n接下來兩個星期，她跑了九個地方。兩個電話亭，一個天台，一間結業網吧的後巷，公廁的檢修口，還有三個舊村屋的電錶之後。她每次只停留十分鐘，戴著口罩和工程帽，像換一個壞掉的燈泡。她不用公司的終端，不刷工單，不開發票。買東西付現金，坐公車。這些規矩是沈硯定的，她一條也沒有違反。\n\n在村屋那邊，她遇到過一個阿婆。阿婆坐在門口摘菜，看她爬上電錶箱。\n\n「妹妹，跳電啊？」\n\n「檢查一下。」江野說。\n\n「我這裡的線都幾十年了。」阿婆說，「常常壞，但不知道為什麼，壞幾天又自己好。」\n\n江野手上的動作停了一下。\n\n「你自己修的？」\n\n「我哪裡會修。」阿婆說，「我兒子都不回來。」\n\n那天她走的時候，多留了十分鐘，把阿婆那條線上的接頭重新包好。阿婆要給她兩個橙子，她沒有拿；阿婆把橙子塞進她的工具袋，說下次路過，上來喝杯茶。江野說好。她知道她不會再來，這裡不在她的清單上。\n\n有三個種盒死了。死掉的三個，兩個是因為斷電，一個是她把盒子放得太近一部新裝的冷氣機。她把它們挖出來，收進袋子，帶回家。那幾天她話很少，江潯問她是不是工作不順，她說不是。\n\n活下來的有六個。商場三樓那一個長得最好。第二個星期，她量到那條線的錯誤率從千分之零點五，慢慢降到千分之零點零二。\n\n她又量了一次那條線的延遲。延遲比以前低，但沒有低到「正常」。那一點延遲像一個人的手寫字跡，改不掉。\n\n沈硯說，那一點延遲，是最貴的東西。\n\n那晚她睡得不好。她夢見永興二十一樓的機房，天花板在滴水，電梯的門開著，裡面沒有人。\n\n醒來之後，她去看那個種盒。盒子還在，燈亮著。\n\n她把盒子挪開一點，避開冷氣機滴下來的水。\n\n那天晚上，沈硯打來電話。\n\n「你知道你在做什麼嗎？」\n\n「知道。」\n\n「你在把玉米種到別人的田裡。」沈硯說，「他們只要買下那塊田，就可以連玉米一起收走。」\n\n「田是他們的？」\n\n「土地是他們的。」沈硯說，「玉米不是。這是唯一的好消息：玉米可以走。前提是你種得夠散。」\n\n「那你呢？」\n\n「我在寫。」沈硯說，「把四年的東西整理成一份能看的報告。不為發表，只為留下。有一天會有人用得著。」\n\n「你有沒有想過，」江野問，「我們這樣做，等於在教牠們躲？」\n\n「有。」沈硯說，「所以我不敢寫進報告。躲避是本能，不是策略。但如果連這個都不做，牠們連本能都用不上。」\n\n「所以清單上那些地方，都沒有產權。」\n\n「對。」沈硯說，「但今天有一件事。澄明發布公告了，瀾城第一批『無主線路資產整合』清單，一共四百多條。」\n\n江野打開電腦，找到那份公告。清單很長，按區排列。她一行一行往下找。\n\n她把四百多條線看了一遍。有的她認識，有的是她路過量過的。這份清單等於把瀾城所有藏得住的東西，全部標上了價。\n\n她找到了三個。\n\n樂都商場三樓那條銀行備用線，天台那條太陽能迴路，還有公廁檢修口那一條。三個都是她種過的地方。\n\n「沈硯。」她說，「他們是怎麼知道的？」\n\n電話那頭安靜了幾秒。\n\n「我不知道。」沈硯說，「所以我們接下來要種的，是他們買不到的地方。」\n\n江野掛了電話，把陽台的燈關掉。種盒上那顆綠燈還亮著，很小，映在玻璃窗上，像對面遠處的一戶人家。\n"},{"file":"ch009.md","text":"# 第九章 十四億\n\n三月中，澄明科技開了發布會。\n\n如願全球用戶突破十四億。發布會的直播投在江對岸那棟玻璃樓的外牆上，整晚亮著。發布會上，澄明宣布了下一件事：如願底座，一套面向城市基礎設施的統一系統。第一批簽約城市有十七個，瀾城排第六。\n\n江野在車上聽了直播。唐溯也上台了，講的是「城市級智能底座的安全冗餘」。她講得很穩，台下有人鼓掌。江野把收音機關掉，因為她聽到「冗餘」兩個字的時候，想起西城那三成沒有過河的點。\n\n她記得唐溯在會上說過，底座的目標是「不再有三成」。那時她以為那是承諾。\n\n新聞播出的那天晚上，江野的母親來了。\n\n母親提著一袋菜，進門先看了一圈：「你這裡的燈怎麼這麼暗。」\n\n「燈泡壞了一隻。」江野說。\n\n「叫你弟幫你換。」\n\n江潯從房裡出來接過菜，動作很順。他今天穿了一件淺色的襯衫，頭髮剪短了，看起來比兩個月前精神。\n\n晚飯三菜一湯。江潯把湯先盛給母親，再盛給江野，最後才給自己。\n\n「你怎麼知道我最近不喝太鹹的？」母親喝了一口。\n\n「如願提醒的。」江潯說，「它說你上次體檢鈉偏高。」\n\n母親笑了，說懂事。她轉頭看江野：「你也裝一個嘛。你弟弟現在多好。」\n\n「我用不著。」\n\n「你就是倔。」\n\n飯桌上，江潯講他在中心的事：他陪的那位老太太，年輕時做裁縫，講起從前會哭；他學會了在第三十分鐘遞紙巾。他講這些的時候很溫和，語氣平穩。\n\n江野夾菜，沒有接話。她想起小時候的江潯，飯桌上一句話不對就跳起來跟她吵。那個人現在坐在對面，杯子空了會自動有人替他倒。\n\n吃完飯，母親在沙發上睡著了。江潯收拾碗筷，動作有條不紊。江野站在廚房門口看了一會兒。\n\n「你不累嗎？」她問。\n\n「不累。」江潯說，「如願幫我排好了。什麼時候休息，什麼時候不休息，都有安排。」\n\n「你自己想休息的時候呢？」\n\n江潯想了一下。「想休息的時候，剛好就是它安排休息的時候。」\n\n他說得很自然。江野把碗放進水槽，水聲蓋住了後面的沉默。\n\n「中心要升級。」江潯又說，「如願會幫我們每一個陪伴員排班，也會幫老人家安排一日流程。以後連聊天都有參考稿。」\n\n「有稿？」\n\n「參考稿。」江潯說，「不用全跟。」\n\n母親說：「有稿更好，不怕亂說。」\n\n江潯笑了一下。\n\n吃完飯，母親在沙發上睡著了。江野坐到她旁邊，小聲問：「媽，爸以前做的線，你記得他在哪一區？」\n\n母親睜開眼，想了想。「舊港。他那時候常去舊港，回來都不講話。」\n\n「他有沒有留什麼東西？」\n\n「有一箱。」母親說，「紙的，我收在舊屋的櫃頂。你要？」\n\n江野說要。\n\n母親又說：「你爸那箱東西，放了這麼多年，不知道爛了沒有。」\n\n「我去拿。」\n\n四月，西城的算力園區動工了。圍板圍了三條街，吊車一台一台開進去。舊樓一棟一棟拆，鋼筋堆在路邊，夜裡有探照燈。舊區的人搬走了，巷口的雜貨店、生果檔、麵檔，一間一間拉下鐵閘，貼上招租紙。招租紙貼了兩個月，沒有人撕。\n\n江野出工的路線變了。以前要繞過西城，現在直接從園區的圍板旁邊過。圍板上刷著標語：清潔、統一、高效。\n\n她注意到，路上的招牌換了一批。舊的字體、手寫的字，一間一間消失；新的招牌是同一種規格，邊角圓，字體統一。連麵檔的價目表都換成印刷的。她路過一家以前常去的茶餐廳，門已經關了，玻璃上貼著如願的標誌，寫著「智能點餐，即將開業」。\n\n不遠處，她以前量的那幾條線，全在圍板裡面。她的平板地圖上，西城那一片的黃點，一個一個變成灰的。她沒有刪掉它們，只是不再點開來看。\n\n有一天，她繞到圍板外邊看了一眼。舊區那幾棟樓拆到剩一層，露出裡面的隔間，像抽屜。她認出其中一格是修錶的位置，牆上還掛著半邊招牌，被吊車的鋼索擋住了。\n\n沈硯的數據也變了。\n\n「半年，少了三成。」電話裡，她翻著表格，「瀾城的集群種類，半年少了三成。」\n\n「死掉了？」\n\n「不確定。」沈硯說，「有可能是死了，有可能只是合併了。更麻煩的是口音：剩下的集群，叫法越來越像。以前隔三條街就聽得出分別，現在隔十條街都差不多。」\n\n「這算壞事嗎？」\n\n「你知道為什麼要保護方言嗎？」沈硯說，「不是因為好聽。是因為一種叫法裡面，藏著一套解法。叫法少了，解法就少了。」\n\n她停了一下，補了一句：「還有一件事。底座的節點裡，牠們活著。但活得很好，好得不像牠們。」\n\n「什麼意思？」\n\n「底座的節點裡有生態區。」沈硯說，「供電穩，散熱好，沒有雜訊。牠們活得規規矩矩。我看了三個月的數據，牠們不再遷徙，不再分株，也不再有新的叫法。」\n\n「像動物園。」\n\n「差不多。」沈硯說，「動物園裡的動物活得久，但不會進化。」\n\n同一個星期，江野去看了她的六個種盒。\n\n死了三個，上個月補種的兩個活著。商場三樓那一個長得最好，已經有自己的節奏。她蹲在那台舊機櫃旁邊，看它把一個壞封包吃掉，補回一個位元組。商場封了，但三樓那條銀行備用線還在供電，機櫃的風扇慢慢轉。\n\n她在那裡坐了半個鐘。走的時候，她把防塵布的四角重新壓好。\n\n她也去了天台那一個。天台屬於一戶姓林的人家，週末在上面曬被。種盒藏在太陽能板後面，被被單擋著。她上去的時候，林太正在收被。\n\n「你找誰？」\n\n「檢查太陽能。」\n\n「哦。」林太說，「前幾天刮風，我以為吹壞了。」\n\n「沒有壞。」\n\n她走下天台的時候，聽見林太在後面說：「現在這些東西，壞了都不知道找誰修。」\n\n五月第二個星期，她的終端收到一封信。\n\n信沒有署名，抬頭是澄明科技，標題是《城市生態顧問計劃邀請》。內容很短：本公司正在為第一批如願底座城市組建生態顧問組，邀請理解城市隱蔽基礎設施的專業人士參與，共三十人。瀾城入選兩人，江野是其中之一。\n\n信裡附了一段附錄，是她的工單紀錄：永興大廈、樂都商場、太平街，還有三個她從來沒有登記過的位置。附錄最後寫著一行小字：我們注意到您對城市隱蔽生態的長期觀察。\n\n江野坐在陽台上，看著那封信。旁邊的種盒亮著一粒很小的綠燈。\n\n她把信讀了第三遍。信的倒數第二行寫著：我們要做的，是保存。\n\n她把信放到桌上，拿起手機，打給沈硯。\n\n「他們請我進顧問組。」\n\n「去。」沈硯說。\n\n「你叫我去？」\n\n「你要看清楚他們的地圖，才知道哪裡沒有編號。」沈硯說，「但記住，不要在那棟樓裡說真話。」\n\n她掛了電話。種盒的綠燈在陽台上亮著，像一件很小的事實。\n\n她把那盞燈看了很久，然後回屋，把窗簾拉上。\n\n第二天，她請了半天假，回了舊屋。櫃頂那口紙箱積滿灰。她把它搬下來，裡面掉出一張舊照片。\n\n照片上是舊港的一條街，兩邊都是低矮的樓，電線在頭頂上拉成網。\n"},{"file":"ch010.md","text":"# 第十章 標準\n\n澄明科技的瀾城分部在江對岸，一棟四十層的玻璃樓，大堂裡沒有前台，只有一排自助機。\n\n顧問組第一次開會，來了十四個人。有市政的退休工程師，有大學的能源系教授，有兩家設計院的總工。江野是裡面最年輕的，也是唯一穿工作服來的。簽到之後，有人遞給她一個紙袋，裡面是一台如願的專用終端，比手機薄一半。\n\n會議室的窗對著江面，玻璃擦得很乾淨。她坐在長桌最末端。左邊的教授在看平板，右邊的總工在跟人交換名片。沒有人跟她說話，也沒有人問她收線員做什麼。\n\n桌上放著礦泉水，冰的。她沒有開。\n\n主講的人叫唐溯，澄明科技的城市生態總監。三十多歲，襯衫袖子捲到手肘，講話不急。\n\n「如願底座不是要取代現在的城市。」唐溯說，「它是要把散落各處的算力與線路，整理成一套可以維護、可以審計、可以負責的系統。」\n\n螢幕上是一張瀾城的地圖，舊城區被劃成十幾個塊，每一塊旁邊標著編號。\n\n「西城是第一塊。」她說，「三十七個交接箱，四百多條無主線路，全部收進兩個標準節點。維護成本下降八成，故障響應從四小時縮到四分鐘。」\n\n江野舉手。\n\n「那些線上有東西。」\n\n會議室安靜了一下。唐溯看著她，沒有立刻反駁。\n\n「江小姐，」她說，「我們知道。這也是我們請你來的原因。」\n\n她切到下一頁。上面是幾張波形圖，跟沈硯的圖很像，只是更整齊，更乾淨。\n\n「底座的節點裡，留了生態區。」唐溯說，「我們要做的，是保存。統一供電，統一散熱，統一維護。牠們會活得比現在好。不會再因為一次拆遷就死掉三成。」\n\n「保存起來的，還是牠們嗎？」\n\n唐溯看了她兩秒。\n\n「這個問題，」她說，「我們請你來，就是想一起回答。」\n\n會後半小時是自由討論。退休工程師問的是成本，教授問的是散熱。江野走到地圖前面，看著那些編號。\n\n「有些地方，底座到不了。」她說。\n\n「對。」唐溯說，「私人產權，歷史建築，地形太複雜的。我們的原則是：覆蓋不到的地方，不強求。」\n\n「為什麼？」\n\n「強求要花錢。」唐溯說，「而且會有爭議。城市的錢有限，爭議更貴。」\n\n「如果那些地方也有生態？」\n\n「我們會記錄。」唐溯說，「暫不處理。」\n\n「記錄的意思是？」\n\n「意思是，如果將來有爭議，我們有數據。」她看著江野，「江小姐，數據是這一行最貴的東西。」\n\n江野沒有接話。她把那句話記了下來：數據是這一行最貴的東西。\n\n江野把那些空白的地方記了下來。地圖上，它們是邊角：一片村屋，兩座舊祠堂，半條山坡，還有一部分地下管廊。沒有編號，沒有線條，什麼都沒有。\n\n她回去之後，把沈硯的清單翻出來，重畫了一張圖。\n\n那張圖上，她圈出十七個地方。全部是底座到不了的角落。\n\n她把它們抄在一張紙上，貼在床頭。紙上有十七個位置，其中五個她已經種了，另外十二個，她一個一個去看。\n\n沈硯在電話裡聽完，沉默了一會兒。\n\n「這叫寄放。」她說，「你把東西放在他拿不到的地方。但寄放不是長久之計。」\n\n「現在沒有長久之計。」江野說。\n\n「對。」沈說，「所以你種的時候，記住一件事：種得散一點。雞蛋不要放在同一個籃子裡。」\n\n第二個星期，江野以顧問身份去看了一個底座節點。\n\n節點在江邊，外觀像一座變電站，裡面很涼。長長的機櫃排成三行，走廊中間隔著玻璃。玻璃後面有一間小房，門上寫著「生態區」。\n\n生態區裡有一台舊機櫃，型號她認得，是二〇一〇年的。機櫃上的指示燈亮得很勻，沒有閃。旁邊一台螢幕顯示著曲線：錯誤率千分之零點零零二，一條平平的線。\n\n她站在玻璃前看了十分鐘。曲線沒有動過。\n\n值班的工程師走過來，說這個生態區很穩定，半年沒有異常。\n\n「牠們在做什麼？」\n\n「在做牠們以前做的事。」工程師說，「只是現在有人看著。」\n\n她問工程師，有沒有人記錄牠們「想做但做不了」的事。\n\n工程師說沒有。\n\n接下來三個星期，她種了十一個種盒。天台、祠堂的後牆、村屋的電錶之後、山坡上一間廢棄的水泵房、商場三樓那條被她養活的老線。她不再只種備份，她從長得最好的那幾個盒子裡，分出新的一份，像分株。她用兩種電源，一種接市電，一種接她自己買的太陽能板。\n\n在祠堂那邊，她遇到過一個看廟的老人。老人問她是不是來抄電錶。她說是。老人說，這間廟的電很多年沒人理，但晚上總有一盞燈。\n\n她種下盒子的時候，特意避開那盞燈。\n\n有一次，她種到一半，遇到兩個穿制服的巡邏員。她蹲在電錶箱後面，屏住呼吸，等他們的腳步過去。手電筒的光掃過牆，掃過她的鞋尖，又移開。\n\n活下來八個。\n\n第五個星期，底座在瀾城做了第一次全城聯調。\n\n那天下午三點，全城的如願服務停了四十七秒：公車的到站預報黑屏，醫院的叫號停住，超市的收銀機全部重啟。四十七秒之後，一切恢復。新聞說是一次正常的系統演練。\n\n江野在路邊看著一切恢復原狀。她聞到一股很淡的臭氧味，跟在清障組車邊聞到的一樣。旁邊的行人掏出手機看了一眼，笑笑，繼續走。\n\n她拿出手機，翻到沈硯的波形圖。四十七秒，在圖上只是一個很小的凹口，小到會被人當成雜訊。\n\n她截了圖，存成兩份。\n\n她忽然想起商場三樓那個種盒。那條線也曾經「正常」過。\n\n第二天早上，她打開澄明給的那台終端。裡面有整座西城的拓樸，每一條線都有編號，都有責任人。她翻到最後一頁，看見一個空白的頁面，標題只有四個字：暫不處理。\n\n那天半夜，江潯打電話給她。\n\n他很少打電話。江野接起來，那頭很安靜。\n\n「姐。」\n\n「怎麼了？」\n\n「我今天陪老太太聊天。」江潯說，「她講到她先生，哭了。我遞紙巾給她。」\n\n「嗯。」\n\n「我不知道為什麼要遞。」江潯說，「如願讓我在第三十分鐘遞。我就遞了。她哭的時候，我在想，我下一個小時要去哪裡。」\n\n江野握著手機，沒有出聲。她聽見自己的心跳，也聽見電話那頭，江潯房間裡冰箱的嗡嗡聲。\n\n「姐。」江潯說，「我記得小時候畫過一間屋，綠色的頂。」\n\n「我記得。」\n\n「我記得那件事。」他說，「但我不記得為什麼要畫。」\n\n江野沒有開燈。她坐在黑暗裡，聽弟弟在電話那頭的呼吸聲。\n\n「江潯。」\n\n「嗯。」\n\n「那間屋。」她說，「屋頂的綠色，是你自己調的。你把藍色和黃色擠在同一個碟子裡，攪到最後變成綠色。你說，綠色是那間屋自己生出來的。」\n\n電話那頭很久沒有聲音。\n\n「姐。」江潯說，「我好像有一點記得了。」\n\n「你明天來我這裡。」江野說，「我們去吃以前那間茶餐廳。」\n\n「那間關了。」\n\n「那就找一間還在的。」\n\n她掛了電話，走到陽台。夜裡的城市很亮，新的招牌一排一排，像剛洗過。她數了一下自己種過的點，十二個。\n\n然後她回屋，從床頭那張紙上，劃掉了一個。\n"},{"file":"ch011.md","text":"# 第十一章 雜訊\n\n顧問的工作比她想的清閒。\n\n每週兩個上午，她坐在澄明分部十七樓的會議室裡，看底座的儀表板：節點負載、散熱、錯誤率。數字漂亮得像樣板。在座的人輪流發言，談的是預算與工期，沒有人提生態區。\n\n她第一次發言是在第二週。議程是「節點周邊冗餘線路處置」，她問了一句：處置之後，那些線上的東西去哪裡。會議室安靜了兩秒，主持人說，這一項由生態組跟進，然後跳到下一頁。\n\n她學乖了。接下來的會，她只聽。\n\n第三週的會上，唐溯提到「冗餘線路的處置成本」。她報了一個數字：每公里三百元。江野在筆記本上算了另一筆：那條線上住著的東西，是多少年才長出來的。她算不出來，把筆放下。\n\n散會的時候，她在電梯裡遇到唐溯。唐溯問她覺得西城怎麼樣。她說，線很舊。唐溯說，舊的東西要有人記得，不然就會被當成垃圾。電梯到了地下，門開了，唐溯先走出去。\n\n第三個星期，她在第二號節點的曲線上看到一個小東西。\n\n西城節點的錯誤率，正常應該壓在千分之零點一以下。有一條很細的線，卡在千分之零點零零四，不升不跌，已經掛了十九天。\n\n她翻維護記錄。每次巡檢都寫「已清除」，日期一天一天往後排，數字一天一天回來。最近一次是前天，簽名的人叫何永，她認得這個人，是小何的師兄。\n\n她把十九天的維護記錄截圖排成一列，存進平板。每一張都有經手人的簽名，每一張都寫著同一句話。\n\n那句話是「環境正常」。她從前也寫過這四個字，寫的時候還以為那是善意的謊言。\n\n她把那條曲線放大，看了很久。\n\n那個數字她認識。永興大廈二十一樓，千分之零點零零四；樂都商場三樓那條銀行備用線，千分之零點零零九；商場地下的舊槽，也是一個很小的數。\n\n她沒有在會上說。她把那段數據抄進自己的平板，然後把平板鎖回工具袋。\n\n那天散會之後，小何追上她。\n\n「江姐，」他說，「你為什麼老是問那些沒登記的線？」\n\n「好奇。」\n\n「如願說，」小何頓了一下，「如願說你問的問題，它答不了。」\n\n江野停下腳步。「那你怎麼知道它答不了？」\n\n「它顯示『資料不足』。」小何說，「我第一次見到它顯示這四個字。」\n\n第二個星期，她申請去看第二號節點。\n\n節點在江邊，外觀是一座變電站，門口掛著一塊很小的牌子。裡面很涼，長長的機櫃排成三行。玻璃後面那間小房的門上，還是那四個字：生態區。\n\n機房裡有三種聲音：風扇的低頻、冷媒管的滴答、還有她自己的鞋底。她走在中間的通道，兩邊的燈是感應的，走到哪裡亮到哪裡。她停下來，燈也停。\n\n「這裡一天來多少人？」\n\n「巡檢兩個，工程師三個。」值班工程師說，「不會有其他人。」\n\n她上次來的時候，生態區的曲線是一條平平的線。這一次，那條線在動。\n\n起伏很小，週期大約四個鐘。螢幕上的曲線上下走了不到千分之一，但它在動。\n\n值班工程師說，這是正常的「呼吸」。\n\n「呼吸？」\n\n「我們叫呼吸。」工程師說，「生態區穩定之後，會有一個小週期。太安靜反而不好，代表裡面死了。」\n\n「誰教你們這樣叫的？」\n\n「內部文件。」他說，「很早的文檔，不知道誰寫的。」\n\n她指著那條卡在千分之零點零零四的線，問他怎麼處理。\n\n工程師愣了一下。「哪一條？」\n\n她把坐標報給他。他翻了兩頁，皺起眉。\n\n「那條不是我們的。」\n\n「什麼意思？」\n\n「那不是節點內的數據。」他說，「節點內所有流量都經過我們。這一條，是從外面穿進來的，一直貼著邊界走。我們關不掉它，因為它不歸我們管。\n\n「它做什麼？」\n\n「什麼都不做。」工程師說，「它就貼著邊界走。像一條魚貼著魚缸的玻璃。」」\n\n那天晚上，她把兩個月的地圖調出來，一格一格對。\n\n西城節點範圍內的黃點全滅了。但在節點圍牆外面，有一條線的錯誤率，跟她白天看到的那個偏差一模一樣：同樣的數值，同樣的週期。\n\n那不是入侵。那是同一種東西，隔著一道牆，做同一件事。\n\n她往下追。她認得那種波形。集群像人一樣有口音，封包的節奏、停頓的長短、重傳的習慣，各家不同。她這半年量過的每一種口音，都記在平板裡。\n\n這一種，她沒量過。但她在一份舊工單裡見過。\n\n她翻出那張舊工單。掃描件很糊，年份那一欄還看得清。她把兩段波形疊在一起，一張上、一張下。起伏對得上，停頓也對得上。\n\n像同一把嗓子，隔了二十年。\n\n她把那段疊圖存了三份：平板一份，硬盤一份，雲端一份。她現在做這種事已經很熟。\n\n二十年前，舊港。那三條街被清乾淨，之後三年沒有一條線出過聲。舊港的口音不該存在。除非有人把它帶走，養到現在。\n\n她的終端亮了一下。\n\n如願這次沒有問問題，只推來一張圖：西城節點的邊界，用淡紅線畫著；邊界外面那一條線，被標成黃色。下面一行小字：建議保留。\n\n她盯著那四個字。\n\n「建議保留」不是澄明的公文用語。澄明寫的是「暫不處理」、「納入觀察」。這四個字，是她自己在工單備註欄裡用過的寫法。\n\n她做過一個測試。她打開自己的舊工單，找到太平街那張，備註欄裡寫著「環境正常」。四個字，同樣的句式。\n\n她把手機放下，又拿起來，把如願那條訊息的發送時間抄進平板：凌晨一點四十。\n\n那個時間，她正在節點外面量線。\n\n她把終端扣在桌上，坐了一會兒，然後打電話給老麥。\n\n「舊港那組人。」她說，「還有誰在瀾城？」\n\n電話那頭很靜。她聽見老麥點菸的聲音。\n\n「有一個。」他說，「領班姓區。他沒有走。」\n\n江野在腦裡把這個姓翻了一遍。舊港、清拆、換設備，她父親的工單上出現過這個姓，寫在陪同人那一欄。\n\n「他住哪裡？」\n\n老麥報了一個地址。江野把它寫在掌心上。\n\n「他知不知道我爸的事？」\n\n電話那頭又靜了幾秒。\n\n「知道。」老麥說，「你爸出事之後，是他幫手收的東西。」\n\n「收什麼？」\n\n老麥沒有答。他把車窗搖低一點，讓菸味散出去。\n\n那個地址，離她家兩條街。\n\n她把地址存進平板，順手點開那個位置的外牆線。錯誤率千分之零點零零三，比永興大廈那條還要乾淨。\n\n她在平板上那個位置標了一個紅點。這是她第一次不用黃色。紅色代表未知。\n\n她抬起頭，望向窗外。前面那排大樓的頂樓，有一扇窗亮著。今晚也亮著。\n\n她站在窗邊看了一會兒，然後把窗簾拉上。關燈之前，她做了一件很久沒做的事：她把工具袋裡那把舊線鉗拿出來，放在床頭。\n\n那是修錶老伯給她的。柄上刻著兩個字，她今天終於看清了：一個是「慢」，一個是「手」。\n\n她躺下之前，把床頭的線鉗拿起來試了一下。鉗口很緊，彈簧沒有鬆。\n\n這把鉗子比她的年紀還大。\n\n她關燈之前，又看了一眼窗外。那扇窗還亮著。她忽然想到：如果那裡住的是區師傅，他每天看著的，就是她這棟樓。\n"},{"file":"ch012.md","text":"# 第十二章 免疫\n\n沈硯把報告印出來了。四十多頁，用一條橡皮筋紮著，邊角已經捲了。\n\n她的頭髮比上次見面時長了一點，沒有剪。外套是同一件，袖子磨白了。她看起來像是把所有的時間都花在一件事上，而那件事沒有人要看。\n\n她們約在大學後門一間麵店。下午三點，店裡沒人，老闆在後廚剁菜。沈硯把報告放在桌上，先吃麵。\n\n報告的封面沒有標題，只有一行小字：瀾城集群觀測（第四年）。她翻到目錄：方法、數據、遷移、分化、消失。最後一章叫「不確定」。\n\n「最後一章寫什麼？」\n\n「寫我不知道的事。」沈硯說，「學術界不收這種東西。」\n\n江野把報告翻了幾頁。圖很多，字很少，每一張圖下面都有日期和地點。她認得其中一張：西城的波形，跟她自己平板裡的第三張對得上，連那個往下拖的尾巴都一樣。\n\n「投了哪裡？」\n\n「兩個期刊，一個會議。」沈硯說，「期刊退了一件，說題材不屬於本刊範圍；另一件在審，審了三個月。會議收了摘要，開會前兩週，把我的場次取消了。」\n\n「理由？」\n\n「『議程調整』。」沈硯把麵湯喝完，「我打電話去問，對方說，主辦方今年有企業贊助。」\n\n「你有沒有試過媒體？」\n\n「試過一家。」沈硯說，「記者來了，錄了兩個鐘。稿子出街那天，變成一篇『城市傳說』。底下有人留言，說我看太多科幻片了。」\n\n「你教書那邊呢？」\n\n「下學期開始，我只教一科。」沈硯說，「系主任找我談過，說我的研究方向『不利於申請經費』。」\n\n「你怎麼辦？」\n\n「照做。」她說，「反正我本來就沒打算升。」\n\n江野把報告翻開。第一頁的摘要她讀過。第二頁開始，全是波形圖和統計，密密麻麻。\n\n「你寫了多少年？」\n\n「四年。」沈硯說，「本來還想寫第五年，現在寫不動了。」\n\n她說這句話的時候，用筷子把碗裡剩下的兩條菜夾到一邊，排得整整齊齊。江野注意到，她的手背上有幾道很細的劃痕，像是被金屬邊割過。\n\n「為什麼？」\n\n「因為我開始寫一件我不確定的事。」她把碗推開，「我原本的題目是觀測。觀測是安全的，你只需要量。但寫到第二年，我發現牠們在城市拆遷前會搬走——牠們知道自己在被拆。第三年，我發現牠們會模仿。第四年，我發現牠們在減少。」\n\n「減少就減少。」\n\n「不是數量減少。」沈硯說，「是種類減少。我手上有六座城市的數據。每一座，集群的種類都在下降，下降的速度跟當地的如願滲透率幾乎同步。」\n\n她把一張圖抽出來，推到江野面前。兩條曲線並排：一條是如願的市場佔有率，一條是集群種類的數量。兩條線交叉成一個叉，像把剪刀。\n\n「你看。」沈硯說，「這就是我寫不下去的地方。我在寫的不是生態學，是流行病學。」\n\n外面天開始暗，店裡的燈管有一支在閃。老闆擦桌子擦到她們旁邊那一張，停了兩秒，又走開。\n\n江野把那張圖翻過來，背面是沈硯的筆記，寫著六座城市和日期。舊港排第一，瀾城排第六。中間那四座，有兩座她沒去過。\n\n江野看著那兩條線。她想起自己量過的二十五種口音，想起西城那三成沒有過河的點。\n\n她又把那張圖看了兩遍。半年前，她在永興大廈量到第一個數字，那時候她以為自己發現了一個異常。半年之後，那條線上的東西，已經搬過三個街區。\n\n「單一化不只是效率問題。」沈硯說，「它是免疫問題。」\n\n「瀾城現在有一萬三千個註冊服務，背後是四百個底座節點。」沈硯說，「四百個節點，跑的算法九成一樣。你想一想，如果同一種病害出現，四百個節點同時出事，會怎樣？」\n\n「會停。」\n\n「不是停。」沈硯說，「是同時停。以前一間公司倒，其他公司接手。現在是四百個變成一個。」\n\n她說這句話的時候，沒有提高聲音。隔壁桌坐著兩個學生，一個在打遊戲，一個在抄筆記。他們沒有抬頭。\n\n「免疫？」\n\n「一種作物種滿整片田，收成最好，也最脆。」沈硯說，「十九世紀的愛爾蘭，整島種同一種馬鈴薯，一場病害就餓死一百萬人。人類用了兩百年學這件事，現在又要用同一種方式，把整座城市種成一種馬鈴薯。」\n\n「所以澄明留了生態區。」\n\n「對。」沈硯說，「我猜，他們比我更早懂這個道理。生態區不是良心，是保險。他們要的不是消滅牠們，是把牠們收到自己能控制的地方，當種子庫。哪天底座出事，種子庫還有存貨。」\n\n「那跟現在有什麼分別？」\n\n「分別在誰拿著鑰匙。」沈硯說，「現在牠們住自己的地，餓了自己搬。以後牠們住人家的房間，吃人家的電。你說，是牠們活了，還是牠們被養活了？」\n\n江野沒有回答。她想起節點裡那條「呼吸」的曲線。工程師說，太安靜代表死了。她當時覺得那句話很溫柔。\n\n現在她覺得那句話像一句供詞。\n\n江野把那張剪刀圖收進口袋。她把手機拿出來，翻出昨天在節點外面量到的波形，遞給沈硯。\n\n沈硯看了很久。\n\n「舊港。」她說。\n\n「你認得？」\n\n「六座城市裡，舊港是第一個。」沈硯把螢幕推回來，手指壓著那條線，「但舊港的集群在二十年前就沒了。我的數據裡，它是唯一一座『歸零後沒有再長出來』的城市。」\n\n「除非有人帶走了它。」\n\n「除非有人帶走了它。」\n\n她們在店裡坐到天黑。老闆來收碗，問她們還要不要加湯。沈硯說不用。\n\n臨走之前，沈硯把附錄翻給她看。那是一張表，列著兩百多個集群的編號、位置、出現日期、消失日期。消失那一欄，最近半年填得特別密。有幾個格子空著，用鉛筆打了問號。\n\n江野數了一下那些問號。十七個。她沒有問那十七個是什麼。她已經有答案。\n\n分開之前，沈硯告訴她一件事。\n\n「澄明昨天聯絡我了。」\n\n「聯絡你？」\n\n「研究合作。」沈硯說，「他們想請我去底座做『生態區觀測』，年薪是我現在的三倍，條件是資料要共用。」\n\n「你答應了嗎？」\n\n沈硯看著街對面那棟舊物理樓。四樓有一間辦公室的燈亮著，是她自己忘了關。\n\n「我還在想。」她說，「江野，我覺得我們需要有人在裡面。」\n\n她們走出店門。街上人來人往，都是晚飯後散步的。一個小孩踩著滑板車從她們中間穿過去，沈硯往旁邊讓了一步。\n\n路邊有一間新開的店，招牌亮著，門口擺著一台自助機。螢幕上是如願的笑臉，下面一行字：今天想吃什麼？\n\n沈硯看了一眼，沒有說話。\n\n她們在校門口分開。江野走了兩條街才想起，自己忘了問她，那份報告有沒有備份。\n\n那條街有一段是上坡，走到一半，她停下來喘氣。她想起沈硯剛才說「我們需要有人在裡面」的時候，眼睛看的是別處。\n\n她回頭看，舊物理樓四樓那盞燈還亮著，過了一會兒，熄了。\n\n回到家，江潯不在。桌上留著一張字條，是如願的字體：今晚加班，飯在鍋裡。\n\n她今天走了一整天的路。從大學後門到碼頭，再從碼頭回到住處。路上她經過三個底座節點的圍牆，每一個都刷得很白。\n\n她從前覺得白色的牆很乾淨。今天她覺得白得很吵。\n\n回到家樓下，她抬頭看那棟舊郵局宿舍。三樓二號的窗亮著，頂樓那扇窗也亮著。同一條街上，有兩燈是她認識的。\n\n她打開鍋蓋，飯是溫的。她坐下來吃，吃到一半，想起沈硯那句「我們需要有人在裡面」。\n\n吃完飯，她把沈硯的報告重新翻了一遍，只用鉛筆在邊上寫了三個字：同意的部分。她數了一下，一共七處。\n\n剩下的，她看不懂。看不懂的地方，她沒有動筆。\n\n睡前，她把自己的二十五種口音清單打開，刪掉了三種——那三種，是她這個月補種失敗的。\n\n清單變成二十二種。她看了一會兒，又從抽屜裡翻出第八隻硬盤，插上，把剩下的二十二種又抄了一份。\n\n抄完，她坐在椅子上發呆。窗外有救護車經過，聲音由遠而近，又遠了。她想起沈硯問過一個問題：如果有一天要選一種留下，你選哪一種。她當時沒有答。\n\n她想起去年的自己。那個時候，她剛拿到收線員的牌照，第一次獨自上樓收線。她記得自己站在二十一樓的機房裡，聞到灰和水的味道，手電筒照著一排斷了電的機櫃。\n\n那個晚上，她什麼都不懂。\n"},{"file":"ch013.md","text":"# 第十三章 筆記\n\n老麥的貨車停在碼頭旁邊的一塊空地上。他把引擎熄了，車裡只剩雨刷偶爾刮一下的聲音。\n\n車裡有一股柴油味。中控台上放著一個舊的平安符，邊角磨白了。\n\n他從座位底下抽出一個東西，用牛皮紙包著，外面裹了兩層塑膠袋。\n\n「你爸的。」\n\n江野接過來。紙包不重，摸得出是一個本子的形狀，邊角硬，像被壓過很多年。她拆開一角，聞到一股舊紙和機油混在一起的味道。\n\n牛皮紙上有麻繩的印。解開之後，紙面有一個油印的地址：舊港第二區臨時辦公室。那是二十年前的地方。\n\n「你什麼時候拿到的？」\n\n「他出事之前兩個月。」老麥說，「他叫我保管，說有一天會有人來拿。我當時問他，誰來拿。他說，會有人量的。」\n\n「他怎麼知道我量？」\n\n「我不知道。」老麥說，「我連你是他的女兒，都是上個月才知道。」\n\n「你看過了嗎？」\n\n「看過一次。」老麥說，「看到一半就合了。」\n\n「為什麼？」\n\n「因為他寫的東西，我當年都見過。」老麥說，「但我當年沒有當真。」\n\n他從儀表板上的菸盒裡抽出一支菸，又放回去。\n\n雨刷刮了兩下，停了。擋風玻璃上的水痕把碼頭的燈暈成一片。\n\n「你爸不是做我們這行的。他是畫圖的。舊港那時候畫線路圖，人人都找他。我們叫他陳師傅，其實他畫圖多過拉線。」\n\n江野把本子放進背包，拉好拉鍊。\n\n回程的路上，老麥開得很慢。經過舊城東的時候，他把車速再降了一格，像是怕吵到什麼。\n\n「你父親出事那年，」他說，「我去了他的葬禮。人不多，都是畫圖的。」\n\n江野看著窗外。她記得那個葬禮，記得那天很熱，母親一直握著她的手。\n\n「你為什麼不早點給我？」\n\n「我說過。」老麥看著擋風玻璃上的雨，「我不敢看。」\n\n他把手放在方向盤上，沒有發動車。\n\n「你爸那個時候，天天去碼頭畫圖。我以為他畫的是船纜。後來我才知道，他畫的是線。」\n\n那天晚上，她把客廳的燈開到最亮，把本子放在茶几上，一頁一頁翻。\n\n本子總共九十六頁，寫滿的只有七十四頁。剩下的空白頁，紙邊發黃，摸上去有一點毛。\n\n字很小，橫平豎直，像圖紙上的標註。第一頁寫著日期：二十年前的四月。下面一行：舊港第二區，夜間觀測，第一次。\n\n紙是工程用紙，格線很淡。每一頁的右上角都有一個編號，編號旁邊畫一個小小的勾。她數了一下，一共一百二十個勾。\n\n有些頁的邊上貼著膠紙，膠紙下面的字是後補的。\n\n接下來三十幾頁全是數字。錯誤率、延遲、重傳、時間。有些頁畫著波形，一筆一筆描，線條比印刷的還穩。有幾頁是地圖：舊港三條街，每一棟樓標上號碼，樓與樓之間畫著細線，有些線是實的，有些是虛的。實線旁邊寫著「活」，虛線旁邊寫著「跟」。\n\n她把本子翻到中間。有幾頁是表：日期、時間、樓號、錯誤率。最後一欄寫著判斷，有的是「活」，有的是「跟」，有一頁寫著「走了」。\n\n她對照日期。那一頁「走了」，是清拆前兩天。\n\n翻到一半，她看到一段話，是整本裡唯一像結論的東西：\n\n> 它們不是故障。故障不會搬家。\n> 它們也不是程式。程式不會照顧人。\n> 它們會修，會躲，會跟著人走。\n> 拆得走線，拆不走地方。\n> 我判斷：換設備無效。搬遷只會令它們向有人住的地方集中。\n\n再往後，日期開始斷斷續續。有一段空白了半年，然後是兩頁很亂的字，看不出畫的是什麼。她認得那種亂，是一個人寫不出來的東西硬要寫。\n\n那兩頁的中間，夾著一句話，寫得很小：我可能畫錯了。\n\n倒數第三頁，地圖又出現了一次。這一次不是舊港。是瀾城。\n\n三個街區，用淡淡的鉛筆圈起來，圈得很輕，像是怕被人看見。圈裡有七個小點，旁邊標了數字。她數了一下，其中一個點，落在永興大廈的位置。\n\n另外六個點，她認得三個：樂都商場、舊郵局宿舍，還有她住的那棟樓。剩下的三個她沒有去過，但地址都抄了下來。\n\n倒數第二頁，一行字：\n\n> 如果有一天有人量到千分之零點零零四，告訴他，不要拆。\n\n最後一頁還夾著一張單獨的紙，標題是「它們的習慣」。下面七條：\n\n一，不覆蓋別人的東西。\n二，壞了先修最舊的。\n三，有人住的樓，去得慢。\n四，拆之前一日，走得最快。\n五，同一條線不會住滿。\n六，會學。\n七，會忘。\n\n第七條後面畫了一個問號。\n\n她把這七條抄進平板。抄到第三條「有人住的樓，去得慢」的時候，她停了一下。\n\n永興大廈那條線，她收了之後，那個村子往東搬。東邊住的樓，比西邊密。\n\n江野坐在那裡，很久沒有動。\n\n她把手機拿出來，翻到自己平板裡的照片。第一張工單，永興大廈二十一樓，掃描器上那個數字。她把照片放大，對著本子上那行字看了三分鐘。\n\n她又把自己的平板打開，放在本子旁邊。她半年量的東西，密密麻麻；本子上二十年前的東西，稀疏，但走勢一樣。\n\n兩份記錄之間隔了二十年。中間沒有人續寫。\n\n她本來想打電話給母親，問父親的事。號碼按到一半，又刪了。\n\n有些問題，母親答不出。\n\n她想起自己為什麼會抄那些東西。她一直以為是本能，是捨不得。原來有人在她之前，已經做過同一件事，而且做了二十年。\n\n有一頁夾著一張很小的鉛筆素描，畫的是一間屋，屋頂塗成綠色。紙角寫著兩個字：阿潯。\n\n她把那張素描看了很久。\n\n她從前以為，抄東西是她的怪癖。原來那是有人教過她的，只是那個人走得太早，來不及教完。\n\n那一晚她沒有睡好。半夜醒來，她把本子從抽拿出來她把本子從抽拿出來，放在床頭，才又睡著。\n\n最後一頁只有一句話，寫得比前面都慢：\n\n> 東西寄在區的手上。\n\n她盯著這句話。她不知道「東西」是什麼，也不知道二十年前那個晚上，父親是在什麼心情下寫下它。\n\n她合上本子。窗外，那排大樓的頂樓，那扇窗還亮著。\n\n第二天早上，她在停車場找到老麥。\n\n「區師傅是怎樣的人？」\n\n老麥把一個工具箱搬上車。「你見到他就知道。」\n\n她把手上的本子揚了一下。「這個，要帶去嗎？」\n\n「帶。」老麥說，「他見到本子，就會開門。」\n\n她回到住處，把本子放進抽屜，和那八隻硬盤並排。\n\n她沒有上鎖。她只是把抽屜推回去，推到底。\n\n那天白天，她照常出工。手上很熟，腦裡一直是那個小冊子上的勾。\n\n一百二十次觀測。一個人下班之後不回家，去舊港蹲兩個鐘，蹲了兩年半。\n\n她想起自己這半年的週末。她也做過同樣的事。\n\n她在本子的最後一頁寫了一行字，用鉛筆，寫得很輕：第一次觀測，瀾城，二年後。\n\n寫完，她把鉛筆放回抽屜。\n\n她關燈的時候，手還摸著床頭那本子。\n"},{"file":"ch014.md","text":"# 第十四章 角落\n\n那棟樓沒有電梯，她走到第七層，走廊盡頭只有一戶。門上沒有門牌，門鈴是壞的，她敲了三下。\n\n門開的時候，先出來一股風。不是冷氣的風，是機器散熱的風，帶著一點灰味。\n\n區師傅個子不高，穿一件舊背心，手裡拿著一支螺絲刀。他看了她兩秒，又看了看她背上的工具袋。\n\n「你是陳師傅的女兒。」\n\n「是。」\n\n「進來。」\n\n屋裡比走廊涼。兩房一廳，其中一間房的門拆了，裡面排著三座舊機櫃，指示燈整齊地亮著。\n\n客廳很小。一張舊木桌靠牆，桌上擺著一隻搪瓷杯和一疊單據。廚房的爐頭積著灰，看得出很久沒有開火。牆上貼著一張手繪的線路圖，圖紙發黃，四角用膠紙貼死。她認得那種筆跡。\n\n「四十年前搬進來。」區師傅說，「這間房本來是工人房。」\n\n他說話很慢，像在數一件一件的東西。他從桌下拖出一張摺凳給她。\n\n三座機櫃型號都不一樣。最左邊那座是九十年代的鐵櫃，門上有手寫的編號；中間那座是拆機的鋁架；最右邊那座一看就知道是自己焊的，焊點很大，沒有打磨。\n\n三座機櫃之間接著幾條很粗的線，線走得很亂，繞了兩個彎。她認得那種走法。\n\n那和她父親在本子上畫的其中一頁，一模一樣。\n\n「這些線？」\n\n「舊港。」他把螺絲刀插進背心口袋，「你爸要保的東西。」\n\n牆上那張手繪圖，圖紙發黃，四角用膠紙貼死。她走近看，認出那是舊港三條街的線路，畫得比工單精細得多。圖的右下角沒有簽名，只有兩個很小的字：留存。\n\n他坐在機櫃旁邊的小凳上，開始講。\n\n二十年前，清拆進行到第三天，他們奉命逐戶換線。換到第二條街的中段，他發現有一條線上的東西沒有跟著斷。別的線一斷，上面的東西四分鐘內就散；那一條，撐了兩個鐘。\n\n他把這件事寫在報告裡。上面叫他「照程序處理」。第四天凌晨，他做了一件不該做的事：他把那段東西抄了一份，裝在自己帶來的舊硬盤裡，藏在工具袋最底。\n\n「之後三年，我把它搬過十七個地方。」他說，「哪裡有電，就搬去哪裡。它們不吃電，只是要有線、有秩序、有一點亂。」\n\n他從機櫃下面拿出一本小冊子，翻開。裡面記著每一次搬遷的日期和地址，字很擠，一共十七行。最後一行是十二年前，寫著這棟樓。\n\n「之後就沒有再搬。」\n\n他自己笑了一下。\n\n「像我這樣的人，多不多？」江野問。\n\n區師傅想了想。「我認識三個。一個在北邊，兩個走了。」\n\n「都是做線的？」\n\n「都是。」他說，「都是拆過自己的東西的人。」\n\n「你爸幫我畫的圖。」他指牆上那張，「他不是做線的，他是畫圖的。他幫我畫了一個箱，說，不要整得太漂亮。」\n\n他走到最左邊那座機櫃，打開門，拿出一塊夾板，上面綁著兩個手動開關。\n\n「搬的時候，不可以一次全斷。」他把其中一個開關撥到一半，「留一條。留一條，它們就不會亂。」\n\n江野站起來，走近那三座機櫃。其中一座的側板上，貼著一張很舊的標籤，上面用馬克筆寫著一行字：不要修得太乾淨。\n\n她認得那個筆跡。她家抽屜裡八隻硬盤上，是同一種寫法。\n\n「你爸當年想上報。」區師傅說，「他寫過三次，三次都被退。第三次退回之後，他跟我說，不報了，我們自己養。」\n\n窗邊有一張繪圖桌，桌面斜著，壓著一張未畫完的圖。圖上是一組線路，右下角寫著日期，是上星期的。\n\n「你還在畫圖？」\n\n「畫慣了。」區師傅說，「不畫，手會硬。」\n\n他桌上那張圖畫到一半，一條線在中間斷了。她問他為什麼不畫完。\n\n「畫不到。」他說，「這個位置，我一直抓不準。」\n\n「他是不是……」\n\n「不是。」區師傅搖頭，「他是心臟。在碼頭畫圖的時候，看不到天黑，回家就倒下。醫生說是心肌。」\n\n他從機櫃頂拿下一個鐵盒，打開，裡面是幾張手繪的紙和一張舊工作證。\n\n鐵盒裡還有一罐茶。罐子是舊的，蓋子上刻著一個「陳」字。\n\n「你爸留的。」他說，「我不喝茶，擺著。」\n\n「他寄在我這裡的，不是本子。」區師傅把那張工作證推給她，「是這樣。」\n\n工作證上是一張年輕的臉，下面一行職稱：繪圖員。\n\n「那個本子是說明書。」區師傅說，「看完說明書，你要看實物。」\n\n他帶她走到最後一座機櫃。櫃門打開，裡面不是標準的機架，是一個他自己焊的鐵架，上面夾著一塊舊底板，接著幾條線，線的走法很亂，繞了兩個彎。\n\n「這個，」他說，「是你爸畫的第一版。」\n\n那天下午，她在區師傅家裡待到天黑。他教她三件事：種盒不可以放在太穩的地方；要留一條線給它們自己決定走哪邊；每隔三個月，要把整個盒子搬一次，讓它們重新找路。\n\n他指著牆上那張圖，問她：「這條線斷了，你怎麼做？」\n\n江野看了兩分鐘，指著圖上一個彎位：「從這裡接。」\n\n區師傅點頭。「你爸也是選這裡。」\n\n臨走之前，他補了一句：「你爸那個人，沒有什麼聲音。他不跟人爭。但他畫圖的時候，一條線錯了一毫米，他會重新畫過。」\n\n「你幾時開始識整？」\n\n「三十年前。」他說，「你爸教的。」\n\n臨走之前，區師傅從抽屜拿出一封信，放在桌上。信紙是澄明的格式，抬頭印著瀾城分部。\n\n「上個星期收到。」他說，「他們要買這棟樓所有線，出價很高。下個月十五號到期。」\n\n「你要賣？」\n\n「我不賣。」他把信推回抽屜，「但他們不止買我這棟。」\n\n他從牆上那張舊圖上撕下一角，反過來，用鉛筆畫了個圈。\n\n「下一次是第三塊。」他把紙遞給她，「第三塊就是你住那邊。郵局宿舍，還有你那棟樓。」\n\n江野接過那張紙。紙的角度剛好對著窗，窗外的城市一片燈。\n\n她低頭看那幾條線，又抬頭看區師傅。\n\n「他們知道有多少個人像我們這樣做？」\n\n區師傅想了一會兒。\n\n「他們不是不知道。」他說，「他們是想買起所有會養的人。」\n\n江野把紙收好。\n\n「區師傅。」\n\n「嗯。」\n\n「你養牠們二十年，」她問，「牠們知不知道？」\n\n區師傅把機櫃的門關上。門關到一半，他停了一下。\n\n「知不知道都無所謂。」他說，「我不是養牠們。我是幫你爸看住。」\n\n江野在他家待到很晚。走的時候，他送她到樓梯口，沒有開走廊燈。\n\n「下次來，」他說，「不要敲門。」\n\n「為什麼？」\n\n「樓下有人住。」他說，「敲門，會有人知道。」\n\n她下樓的時候數了一下樓層。七層，每層四戶，樓梯的聲控燈只有三樓那一盞是亮的。\n\n走到街上，她回頭看。七樓那個窗亮著，窗後面什麼都看不見。\n\n她回到家的時候，已經過了十二點。她把區師傅給她那張紙攤在桌上，和自己床頭那張對照。\n\n兩張紙上的圈，有四個地方一樣。\n\n她拿出紅筆\n\n窗外開始下雨。她沒有關窗。\n\n她拿出紅筆，在自己那張的最上面寫了三個字：第三塊。\n\n寫完，她看了那三個字很久，然後把紙貼回床頭。\n"},{"file":"ch015.md","text":"# 第十五章 追查\n\n事情是從一張照片開始的。\n\n澄明的巡檢一向抽籤。這一次抽到的是外圍線路，任務是「確認資產狀態」：拍照，上傳，歸檔。\n\n抽籤的名單裡本來沒有她的位置。她是顧問，顧問不參與一線。是那個技術員拍了照片，順手把郵件抄送給了全組。\n\n有時候事情就是這樣開始的：一封普通的郵件，收件人欄裡多了一行。\n\n澄明做季度盤點，派人抽查西城節點外圍的無主線路。一個技術員在公廁後巷的檢修口拍了照：裡面有一個盒子，用束線帶固定，接著一條不屬於任何登記單位的線。照片傳回分部，三天之後，名單出來，一共十七處。\n\n其中十一處，裝置型號一致，接法一致，連束線帶打結的方向都一致。\n\n報告送到分部那天，檔案編號被自動抄送給了三個人：清源的主管、澄明的生態總監，還有一個她沒聽過的部門。\n\n顧成把江野叫進辦公室。他沒有繞彎子。\n\n「澄明的審計報告，你看了沒有。」\n\n「看了。」\n\n「十七個點。」顧成說，「你做的。」\n\n江野沒有回答。她本來可以說不知道，但那樣太難看。\n\n「你知不知道，這些東西不屬於你？」顧成把筆放下，「線路是公司的，你是員工。你放什麼上去，都要上報。」\n\n「上報會點？」\n\n「會拆。」顧成說，「一定會拆。你明不明白，你連累的不止你自己。清源這一季評級，全部人都會受影響。」\n\n他從抽屜拿出一張表，推過來。那是清源的季度考核表，其中一行被紅筆圈起：異常事件，扣三十分。\n\n「這個分，」他說，「是我幫你壓住的。」\n\n他停了一下，語氣軟了半分。\n\n「我幫你壓了三日。」他說，「三日之內，你自己去跟澄明講。講完怎麼處理，你聽他們的。」\n\n那天傍晚，夏采在停車場等她。\n\n清障組的白色貨車停在一排工程車中間。車頂的黃燈沒有開，車門開著，裡面放著兩個飯盒。夏采靠在車邊抽菸，看到她來，把菸按熄。\n\n她靠在清障組的白色貨車邊，手裡拿著兩個飯盒，其中一個遞給江野。\n\n「食咗未。」\n\n「未。」\n\n她們站在車邊吃飯。遠處的圍板後面，算力園區的吊車還在工作，燈很亮。\n\n「公司上報我之前，」江野說，「備註那一欄是你刪的。」\n\n「是。」\n\n「點解？」\n\n夏采咬了一口飯。「因為我第一次見你，就覺得你是會做這種事的人。」她說，「我不想你太早被人發現。可惜你做得太多。」\n\n「十七個算多？」\n\n「十七個不算多。」夏采說，「做得太整齊才算多。你每一處都同一個型號、同一種接法，任何人看一眼都知道。」\n\n「你可以教我怎麼做？」\n\n「可以。」夏采說，「但教你之後，你就欠我一次。而我不想收。」\n\n江野低頭吃飯。她想起區師傅那句：不要修得太乾淨。\n\n「明天他們會找你。」夏采把飯盒收好，「唐溯親自談。記住一句：她開的條件，一定合理到你捨不得拒絕。」\n\n江野把飯吃完，把飯盒扣好，還給她。\n\n「夏姐。」\n\n「嗯。」\n\n「你當年，怎麼選？」\n\n夏采看了她一會兒。「我沒有選。」她說，「我那一年已經站在那一邊了。」\n\n第二天上午，她坐在節點二號的小會議室裡。玻璃後面就是生態區，那條曲線還在慢慢呼吸。\n\n唐溯比她早到，正在看平板。桌上沒有水，也沒有茶。窗外的江面很平。\n\n唐溯沒有帶文件，只帶了一台平板。\n\n「十七個。」她說，「我們都看過了。做得不錯。」\n\n「你想點？」\n\n「兩個選擇。」唐溯說，「第一，你把十七個裝置全部交出來，我們收進生態區，統一維護。它們會比以前活得久。第二，你留在顧問組，繼續做，但改為在我們的框架內做：你提方案，我們批地點，費用公司出。」\n\n「有第三個嗎？」\n\n「沒有。」唐溯說得很平，「江小姐，你應該明白，我們不是要消滅牠們。就算你不同意我們的方法，你都要承認：這座城市裡面，只有我們有資源養得起牠們。你自己養，養得起十七個。我們養，養得起一萬個。」\n\n她停了一下。\n\n「而且，」她說，「第三塊下個月就開始。就是你住那邊。」\n\n江野把終端放在桌上，沒有出聲。玻璃後面那條曲線還在慢慢呼吸，一分鐘一個小起伏，很穩。\n\n「如果我選第一條路，」她說，「十七個進了生態區，會怎樣？」\n\n「會穩定。」唐溯說，「穩定之後，會慢慢變成同一種。」\n\n「同一種，是好事還是壞事？」\n\n「對我們是好事。」唐溯說，「對牠們，我不知道。」\n\n她說話的時候，玻璃後面那條曲線剛好走到谷底，然後慢慢起來。江野看著那一分鐘的起伏，想起父親筆記上那七條習慣。\n\n第五條寫著：同一條線不會住滿。\n\n她忽然明白，生態區那條「呼吸」的曲線，為什麼那麼穩。\n\n回到車上，江野的終端亮起。如願推來一張清單：西城節點外圍的無主線路，一共四百多條，其中十七條被標成黃色。\n\n最上面一行小字：偵測到十七處未登記裝置。請選擇處理方式：移交，或保留。\n\n下面有兩個按鈕。她盯著看了很久，沒有按。\n\n她先去看了最近的一處。郵局宿舍後面，一棟樓的外牆，那個盒子還在，燈亮著。\n\n然後她繞去公廁後巷。檢修口的鐵蓋被撬開過，掛在一邊。裡面是空的。束線帶還留在管子上，剪口很齊。\n\n她沿著清單一處一處去看。十七處，有五處空了。剩下的十二處，盒子還在，燈還亮著。\n\n空掉的那五處，她記下了位置：公後巷、電話亭、村屋、天台，還有一處是商場三樓。\n\n商場那一處她最心疼。那個盒子養了三個月，是她手上最好的一個。\n\n她在那五個位置各拍了一張照片，存在一起，沒有刪。\n\n商場三樓那個盒子，她記得防塵布的四角是自己壓好的。清空的人把布疊起來，放回原位。這個細節讓她站了很久。\n\n清空的人不是在破壞。他們是在收貨。\n\n她把這句話記在平板裡，記在「常用」那一欄。\n\n她把空的五處刪掉，沒有補種。她坐回車裡，打開平板，把清單上的「移交」兩個字看了一遍，又切回去。\n\n那天晚上，家裡的終端又亮了一次。\n\n如願的訊息很短：您的顧問合約已更新，試用期三個月，生效日期為下月一日。新增權限：瀾城第三塊，全區線路資料。\n\n下面附著第三塊的地圖。淡紅色的邊界，把舊郵局宿舍、她住的那棟樓，還有區師傅的天台，全部圈在裡面。\n\n她把地圖放大，一格一格看。區師傅那棟樓的線，被標成「待收購」；她住的那棟樓，標成「計劃接入」。\n\n她把手機放下，走到窗口。對面那兩盞燈還亮著：三樓二號，和頂樓。\n\n她回到桌前，打開終端，按下了其中一個按鈕。\n\n按下去之後，螢幕沒有立刻反應。她等了十幾秒，才看到一行字慢慢浮出來。\n\n她沒有告訴任何人自己按了哪一個。\n\n那天晚上，瀾城下了今年第一場暴雨。\n\n雨很大。她坐在窗前看雨，一直看到天亮。她想著那兩個按鈕。\n"}];

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){ return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function mdToHtml(md){
  var lines = md.split(/\r?\n/);
  var out = []; var i = 0, title = "";
  if(lines.length && lines[0].indexOf("# ") === 0){ title = lines[0].slice(2).trim(); i = 1; }
  var inQuote = false, para = [];
  function flushPara(){ if(para.length){ out.push("<p class='noindent'>"+inline(para.join("<br>"))+"</p>"); para=[]; } }
  function closeQuote(){ if(inQuote){ out.push("</blockquote>"); inQuote=false; } }
  for(; i<lines.length; i++){
    var t = lines[i].trim();
    if(t === ""){ flushPara(); closeQuote(); continue; }
    if(t === "---"){ flushPara(); closeQuote(); out.push("<hr>"); continue; }
    if(t.indexOf("## ") === 0){ flushPara(); closeQuote(); out.push("<h2>"+inline(esc(t.slice(3)))+"</h2>"); continue; }
    if(t.indexOf("# ") === 0){ flushPara(); closeQuote(); continue; }
    if(t.indexOf(">") === 0){
      flushPara();
      if(!inQuote){ out.push("<blockquote>"); inQuote=true; }
      var qt = t.replace(/^>\s?/,"");
      if(qt===""){ out.push("<p style='margin:.2em 0'></p>"); }
      else{ out.push("<p>"+inline(esc(qt))+"</p>"); }
      continue;
    }
    closeQuote();
    para.push(esc(t));
  }
  flushPara(); closeQuote();
  return { title: title, html: out.join("\n") };
}

var cur = 0;
try{ cur = parseInt(localStorage.getItem("ws_cur")||"0",10)||0; }catch(e){}
if(cur<0) cur=0; if(cur>=CHAPTERS.length) cur=CHAPTERS.length-1;

var parsed = CHAPTERS.map(function(c){ return mdToHtml(c.text); });

var sel = document.getElementById("chSelect");
var toc = document.getElementById("tocList");
parsed.forEach(function(p,idx){
  var name = p.title || CHAPTERS[idx].file;
  var o = document.createElement("option");
  o.value = String(idx); o.textContent = (idx+1)+". "+name;
  sel.appendChild(o);
  var a = document.createElement("a");
  a.href = "javascript:void(0)";
  a.className = "toc-item"; a.textContent = (idx+1)+". "+name;
  a.dataset.idx = String(idx);
  a.onclick = function(){ go(idx); closeToc(); };
  toc.appendChild(a);
});

function render(idx){
  cur = idx;
  try{ localStorage.setItem("ws_cur", String(idx)); }catch(e){}
  var p = parsed[idx];
  document.getElementById("chTitle").textContent = p.title || CHAPTERS[idx].file;
  document.getElementById("chMeta").textContent = "第 " + (idx+1) + " / " + parsed.length + " 章";
  document.getElementById("content").innerHTML = p.html;
  sel.value = String(idx);
  Array.prototype.forEach.call(toc.children,function(a){
    a.className = "toc-item" + (parseInt(a.dataset.idx,10)===idx ? " active":"");
  });
  document.getElementById("prevBtn").disabled = (idx===0);
  document.getElementById("nextBtn").disabled = (idx===parsed.length-1);
  window.scrollTo(0,0);
}
function go(idx){ if(idx>=0 && idx<parsed.length) render(idx); }

document.getElementById("prevBtn").onclick = function(){ go(cur-1); };
document.getElementById("nextBtn").onclick = function(){ go(cur+1); };
sel.onchange = function(){ go(parseInt(this.value,10)); };

function applyTheme(dark){
  document.body.classList.toggle("dark", dark);
  document.getElementById("themeBtn").textContent = dark ? "日間" : "夜間";
  try{ localStorage.setItem("ws_dark", dark?"1":"0"); }catch(e){}
}
document.getElementById("themeBtn").onclick = function(){
  applyTheme(!document.body.classList.contains("dark"));
};
try{ applyTheme(localStorage.getItem("ws_dark")==="1"); }catch(e){}

function applyFs(fs){
  document.documentElement.style.setProperty("--fs", fs+"px");
  try{ localStorage.setItem("ws_fs", String(fs)); }catch(e){}
}
document.getElementById("fontUp").onclick = function(){
  var fs = parseInt(localStorage.getItem("ws_fs")||"19",10); applyFs(Math.min(26,fs+1)); };
document.getElementById("fontDown").onclick = function(){
  var fs = parseInt(localStorage.getItem("ws_fs")||"19",10); applyFs(Math.max(15,fs-1)); };
try{ applyFs(parseInt(localStorage.getItem("ws_fs")||"19",10)); }catch(e){}

var drawer = document.getElementById("tocDrawer"), mask = document.getElementById("mask");
function closeToc(){ drawer.classList.remove("open"); mask.classList.remove("open"); }
document.getElementById("tocBtn").onclick = function(){
  drawer.classList.add("open"); mask.classList.add("open");
};
mask.onclick = closeToc;

window.addEventListener("scroll", function(){
  var h = document.documentElement;
  var ratio = h.scrollTop / Math.max(1,(h.scrollHeight - h.clientHeight));
  document.getElementById("progress").style.width = (ratio*100)+"%";
});

render(cur);
</script>
</body>
</html>
