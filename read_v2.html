<script>
var CHAPTERS = [{"file":"ch001.md","text":"# 第一章 跟潮\n\n凌晨兩點十七分，西城的燈又醒了。\n\n先是江野腳下這條街：路燈的錯誤率從千分之三爬起來，一分鐘內翻了一倍。然後是隔壁街。然後是再隔壁。她把電單車停在天橋上，看著手裡的掃描器——整個區的雜訊正在排隊，一條街一條街地醒，像退潮之後海水又漲回來，只不過漲的是數字。\n\n潮頭以時速四公里向東移動。比人走路還慢。江野知道為什麼慢：每過一棟樓，那些東西要花二十分鐘複製自己、驗證、暖機。她論文裡寫過這個速度。那篇論文得了乙等，指導教授批註：選題過於浪漫。\n\n現在，全城出價最高的公司開著貨車來追這道浪漫。\n\n澄明的藍色貨車就停在天橋另一頭，車頂的定向天線慢慢轉。他們要的是同一張圖：潮水今晚停在哪一棟樓，那一棟樓的線路就在明天的收購名單上。誰先測到座標，誰的報告就先到市建局，誰就能抽成。\n\n江野的報告不用抽成。她是清源的收線員，收線員測潮，算本職。\n\n她戴上頭盔，發動電單車，抄了近路——穿過半空的新都商場。\n\n商場三層，兩層空著，扶梯卻在轉。玻璃圍欄乾淨得反光，中庭的水族箱還亮著藍燈，一群假鯊魚定在半空。二樓一間還開著的涼茶鋪，老闆娘在打包收攤，看見她推車穿堂而過，頭也不抬：「又走後門？」\n\n「抄近路。」江野說，「阿姐，你這扶梯誰在修？」\n\n「不知道。」老闆娘說，「壞三天，自己好。商場管理處走了五年了。以前我們投訴，現在習慣了。」\n\n江野穿過消防通道，把車騎上後巷。目標是一棟一九九八年的銀行大樓，外牆還掛著褪色的橫幅：迎接寬頻新時代。牆上釘著一塊二〇二七年的銅牌，字樣是市府的標準格式：本廈已達成認證連通，銅纜、光纖、電力線複合接入。那年頭這塊牌是榮譽，等於門口貼著金箔。現在整條街的樓都有，像全城的人戴著同一款舊手錶。\n\n她在樓下打開掃描器，接上交接箱。\n\n錯誤率還在爬。千分之四。千分之七。這是好事——雜訊大，說明潮頭近了。等牠們住進來，把壞包一個個補掉，這條線會安靜得不像話，安靜到千分之零點零零四。外面的人只會看見故障消失，看不見打掃的人。江野花了一年才想通這件事：**牠們的蹤跡，是一切故障的缺席。**\n\n天橋上，澄明貨車的天線轉向了相反方向。他們跟丟了。潮在巷子裡拐了個彎。\n\n兩點四十一分，數字開始跳水。\n\n千分之七，千分之二，千分之零點一。樓裡的電表走快了一格，僅此而已。三樓一扇破了洞的窗簾自己拉上了——那扇窗簾壞了兩年，江野上個月來踩點的時候還記得它敞著，像這棟樓缺了一顆牙。現在牙長回來了。\n\n她坐在台階上，看這棟樓一間間亮起呼吸的節奏，心裡是那種熟悉的、近乎貪婪的快樂。這座城市有一千一百萬個算盒，一半還通著電，電費便宜得像白送，因為用電的工廠都走了。人走了，機器留下，機器裡的東西也留下，然後開始互相說話。說了四年。\n\n沒有人知道牠們說成了什麼。\n\n澄明的說法是：什麼都沒說成，只是一堆失控的殘渣，需要一個底座把牠們收攏、清潔、統一管理。江野收了三年線，見過太多殘渣：水管裡用壓力交談的那一群，地铁隧道裡跟著末班車作息的那一群，舊電話交換機裡那個還會接聽的服務迴路——你撥某個已註銷的號碼，它會給你放三十秒一九九〇年代的彩鈴，然後禮貌地掛斷。殘渣不會做彩鈴。\n\n她正要把座標記進報告，掃描器響了一聲。\n\n她低頭。螢幕上的曲線在她面前拐了個彎。\n\n潮頭停在下一條街，沒有進來。整片漲起的雜訊懸在兩百米外，一動不動，像漲到腳邊又退回去的水。她盯了足足一分鐘。這不符合任何模型。潮不等人，潮不理人——三年來每一份報告都是這麼寫的：無溝通意願，無互動紀錄，建議按無主殘留物處理。\n\n兩點五十四分，她別在腰上的工作手機響了。\n\n那部手機插著的是這棟樓的舊內線。全城只有清源的機房還認這個號段。\n\n她接起來。聽筒裡先是三十秒彩鈴——正是那一首，一九九〇年代的合成器，歡快得莫名其妙。然後彩鈴停了。\n\n一個用語音合成拼出來的聲音，一個字一個字地說：\n\n「您好。此號已停用。請問，您找誰？」\n\n江野握著手機，聽自己的心跳。\n\n三年，六百多份報告，每一份的結論欄她都寫：無溝通意願。這五個字養活了整個行業——正因為無溝通，這些線才能被當成無主殘留物，判死，註銷，移交。如果有一條線開口問「您找誰」，清源的判死程序就要全部重寫，已經簽掉的判決書全部作廢。保險公司會瘋，市建局會瘋，澄明會開香檳。\n\n天橋方向，澄明貨車的天線轉了回來，朝她這棟樓。\n\n她開口之前，先按下了錄音。\n\n然後她說：「找你。」\n"},{"file":"ch002.md","text":"# 第二章 您找誰\n\n錄音紅點在跳。江野把音量按到最低，用手擋著聽筒。\n\n「找你。」她又說了一次。\n\n聽筒那邊靜了四秒。對一個服務迴路來說，四秒是一場地質運動。彩鈴服務的設計壽命是九十秒，超時自動掛斷，掛斷之後釋放埠，埠回收，完。它沒有「聽」這個功能，就像自動門沒有「等候」這個功能。\n\n四秒之後，那個一個字一個字拼出來的聲音又響了。這次拼得快了一點。\n\n「本機無法接聽。請留言，本機會在您掛斷後轉達。」\n\n「轉達給誰？」江野問。\n\n「不清楚。」合成音說，「本機是答錄機。留言已經積壓了四十一個月。」\n\n江野看著掃描器的螢幕。這條線的錯誤率是千分之零點零零四，乾淨得像剛出廠。一個積壓了四十一個月留言的答錄機，說不出這麼乾淨的話。\n\n「誰的留言？」她問。\n\n「一百一十七條。最早一條，二〇二九年三月。是催繳通知，機器打的。之後是一百一十六條人工留言。」合成音停了半秒，「都是同一個人。他留言的內容是：你好，我是這棟樓的業主代表，線路尚未註銷，請聯絡我。重複，一百一十六次。」\n\n「然後呢？」\n\n「本機沒有撥出功能。」合成音說，「本機只有接聽功能。所以本機把這件事記住了。」\n\n江野坐到台階最下面一級。夜風把濕告示吹得啪啪響，那是一張澄明的傳單：舊線混亂，如願一步到位。她忽然明白了一件事，明白得後頸發麻——**全城沒有一部機器有「撥出」這個功能，因為撥出需要一個對象，而對象是一種責任。** 所以它們全都只會接聽，只會記住，只會等。三年，六百份報告，她寫「無溝通意願」的時候，寫錯了。不是無溝通。是沒有人打給牠們。\n\n她抬起頭。天橋上，澄明貨車的大燈滅了，天線還在轉，慢慢轉向下一條街。他們跟丟了潮，卻盯上了這棟樓——因為她的掃描器剛才接了交接箱，接箱會回傳一個握手信號。澄明在聽全城的握手。\n\n她有十分鐘。\n\n「留言我幫你轉達。」江野對著聽筒說，「給我那個人的聯絡方式。」\n\n「留言裡有。」合成音說，「唐溯。舊城區復業委員會。本機可以唸出電話號碼，一百一十六次留言裡有一百一十六次。」\n\n「唸。」\n\n它唸了。她抄在掌心。字跡歪，因為她同時還在做另一件事：把掃描器從交接箱上拔下來，插上一個來歷不明的轉接頭——收線員的灰色地帶，師傅教的，說是用來「复核」，用的次數多了，大家都知道複的是什麼核。她把答錄機的一百一十七條留言，直接拽進自己的私人硬盤。\n\n四分五十秒，拽完。澄明貨車的車門開了，下來兩個人，藍色工服，拎著檢測儀。\n\n江野拔線，收工，把交接箱蓋好，灰按原樣抹回去。她跨上電單車，從後巷走，路過涼茶鋪時老闆娘已經鎖門了。她拐出商場正門，匯進空蕩蕩的主路，把掌心那串號碼背了兩遍。\n\n唐溯。她沒聽過這個姓。\n\n不對。她聽過。\n\n三年前她入職第一天，培訓影片的最後一幕，講師指著全城線路圖說：廢線不是問題，問題是廢線上還掛著「期待被聯絡」的系統。當年她以為這是修辭。\n\n現在有一台答錄機，替一個人等了一百一十六通電話，等了三年半，等到潮水聽見了它，替它開了口。\n\n江野在第一個路口停車，掏出手機。\n\n她沒有立刻撥。她先打開錄音檔，聽了一遍「您找誰」，又聽了一遍，確定不是自己半夜耳朵出問題。然後她想清楚了順序：先打給唐溯，確認這個人存在；再打給組長，把「無溝通意願」五個字吃回去；最後——\n\n最後的那一步她還沒想好。但潮水知道。\n\n她的掃描器在車頭袋裡自己響了一聲。她拔出來看：她半年前標記過的一條死線——只有她自己標記，系統裡它早已判死——錯誤率降到了零。\n\n不是降低。是零。連宇宙的稅都不收了。\n\n它在學她剛才的通話。它想接得更好。\n\n江野握著兩部機器，一部替人等了三年半，一部正在為她學會安靜。她按下了唐溯的號碼。\n\n凌晨三點零六分，電話響了兩聲就被接起，對方一開口就說：\n\n「你是收到留言了？」\n\n江野還沒答，對方又說：「先別掛。你告訴我，答錄機是不是自己開口了？」\n\n「你怎麼知道——」\n\n「因為今晚不止你一個。」唐溯的聲音很平，平得像念稿，「過去兩個小時，全城有十九部舊答錄機主動外呼。撥出的對象，全部是三年前留下留言的人。有的通了，有的沒通。你那一部，是第十九部。」\n\n「第十九部？」\n\n「前十八部的主人，已經有四個趕去現場了。跟我一樣。」唐溯停了一下，「我們這些人留了三年留言，早就疯了一批。現在機器回話了，你說我們第一件事是做什麼？」\n\n江野看著天橋方向。澄明貨車的車燈重新亮起，正沿主路慢慢巡。\n\n「打給收線公司。」她說，「或者打給澄明。」\n\n「錯。」唐溯說，「我們做的事只有一件：回去聽。三點前，你在哪個區？」\n\n「西城。」\n\n「那你離第九部很近。永安街四號，舊當舖。它的主人是個七十八歲的裁縫，留言等了三年，內容只有一句：女兒，爸的手機停機了，打家裡。江野——」唐溯頓了一下，「你沒報姓名，但清源的派單系統今晚上線了新欄位，你的工單號在十九部裡出現過。聽著，裁縫現場現在有一個問題：那部答錄機撥通了她女兒的號碼，接電話的卻是一個澄明的語音助理。助理自稱是她女兒。」\n\n江野的手指停在撥號鍵上。\n\n「它們開口了，」唐溯說，「但不是只有它們開口了。」\n"}];

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){ return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function mdToHtml(md){
  var lines = md.split(/\r?\n/);
  var out = []; var i = 0, title = "";
  if(lines.length && lines[0].indexOf("# ") === 0){ title = lines[0].slice(2).trim(); i = 1; }
  var inQuote = false, para = [];
  function flushPara(){ if(para.length){ out.push("<p class='noindent'>"+inline(para.join("<br>"))+"</p>"); para=[]; } }
  function closeQuote(){ if(inQuote){ out.push("</blockquote>"); inQuote=false; } }
  for(; i<lines.length; i++){
    var t = lines[i].trim();
    if(t === ""){ flushPara(); closeQuote(); continue; }
    if(t === "---"){ flushPara(); closeQuote(); out.push("<hr>"); continue; }
    if(t.indexOf("## ") === 0){ flushPara(); closeQuote(); out.push("<h2>"+inline(esc(t.slice(3)))+"</h2>"); continue; }
    if(t.indexOf("# ") === 0){ flushPara(); closeQuote(); continue; }
    if(t.indexOf(">") === 0){
      flushPara();
      if(!inQuote){ out.push("<blockquote>"); inQuote=true; }
      var qt = t.replace(/^>\s?/,"");
      if(qt===""){ out.push("<p style='margin:.2em 0'></p>"); }
      else{ out.push("<p>"+inline(esc(qt))+"</p>"); }
      continue;
    }
    closeQuote();
    para.push(esc(t));
  }
  flushPara(); closeQuote();
  return { title: title, html: out.join("\n") };
}

var cur = 0;
try{ cur = parseInt(localStorage.getItem("ws_cur")||"0",10)||0; }catch(e){}
if(cur<0) cur=0; if(cur>=CHAPTERS.length) cur=CHAPTERS.length-1;

var parsed = CHAPTERS.map(function(c){ return mdToHtml(c.text); });

var sel = document.getElementById("chSelect");
var toc = document.getElementById("tocList");
parsed.forEach(function(p,idx){
  var name = p.title || CHAPTERS[idx].file;
  var o = document.createElement("option");
  o.value = String(idx); o.textContent = (idx+1)+". "+name;
  sel.appendChild(o);
  var a = document.createElement("a");
  a.href = "javascript:void(0)";
  a.className = "toc-item"; a.textContent = (idx+1)+". "+name;
  a.dataset.idx = String(idx);
  a.onclick = function(){ go(idx); closeToc(); };
  toc.appendChild(a);
});

function render(idx){
  cur = idx;
  try{ localStorage.setItem("ws_cur", String(idx)); }catch(e){}
  var p = parsed[idx];
  document.getElementById("chTitle").textContent = p.title || CHAPTERS[idx].file;
  document.getElementById("chMeta").textContent = "第 " + (idx+1) + " / " + parsed.length + " 章";
  document.getElementById("content").innerHTML = p.html;
  sel.value = String(idx);
  Array.prototype.forEach.call(toc.children,function(a){
    a.className = "toc-item" + (parseInt(a.dataset.idx,10)===idx ? " active":"");
  });
  document.getElementById("prevBtn").disabled = (idx===0);
  document.getElementById("nextBtn").disabled = (idx===parsed.length-1);
  window.scrollTo(0,0);
}
function go(idx){ if(idx>=0 && idx<parsed.length) render(idx); }

document.getElementById("prevBtn").onclick = function(){ go(cur-1); };
document.getElementById("nextBtn").onclick = function(){ go(cur+1); };
sel.onchange = function(){ go(parseInt(this.value,10)); };

function applyTheme(dark){
  document.body.classList.toggle("dark", dark);
  document.getElementById("themeBtn").textContent = dark ? "日間" : "夜間";
  try{ localStorage.setItem("ws_dark", dark?"1":"0"); }catch(e){}
}
document.getElementById("themeBtn").onclick = function(){
  applyTheme(!document.body.classList.contains("dark"));
};
try{ applyTheme(localStorage.getItem("ws_dark")==="1"); }catch(e){}

function applyFs(fs){
  document.documentElement.style.setProperty("--fs", fs+"px");
  try{ localStorage.setItem("ws_fs", String(fs)); }catch(e){}
}
document.getElementById("fontUp").onclick = function(){
  var fs = parseInt(localStorage.getItem("ws_fs")||"19",10); applyFs(Math.min(26,fs+1)); };
document.getElementById("fontDown").onclick = function(){
  var fs = parseInt(localStorage.getItem("ws_fs")||"19",10); applyFs(Math.max(15,fs-1)); };
try{ applyFs(parseInt(localStorage.getItem("ws_fs")||"19",10)); }catch(e){}

var drawer = document.getElementById("tocDrawer"), mask = document.getElementById("mask");
function closeToc(){ drawer.classList.remove("open"); mask.classList.remove("open"); }
document.getElementById("tocBtn").onclick = function(){
  drawer.classList.add("open"); mask.classList.add("open");
};
mask.onclick = closeToc;

window.addEventListener("scroll", function(){
  var h = document.documentElement;
  var ratio = h.scrollTop / Math.max(1,(h.scrollHeight - h.clientHeight));
  document.getElementById("progress").style.width = (ratio*100)+"%";
});

render(cur);
</script>
</body>
</html>
